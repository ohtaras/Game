name: Fetch Daily Draws

on:
  schedule:
    - cron: '30 21 * * *'   # 00:30 Athens (UTC+3) — μετά το τέλος των κληρώσεων
  workflow_dispatch:          # χειροκίνητη εκτέλεση όποτε χρειαστεί

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch KINO draws (σήμερα + χθες)
        run: |
          TODAY=$(TZ=Europe/Athens date +%Y-%m-%d)
          YESTERDAY=$(TZ=Europe/Athens date -d 'yesterday' +%Y-%m-%d)
          python3 data/fetch_kino.py $YESTERDAY $TODAY

      - name: Fetch Power Spin draws (σήμερα + χθες)
        run: |
          python3 data/fetch_ps.py  # σήμερα
          YESTERDAY=$(TZ=Europe/Athens date -d 'yesterday' +%Y-%m-%d)
          python3 data/fetch_ps.py $YESTERDAY

      - name: Commit & push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          git diff --staged --quiet && echo "Καμία αλλαγή." || (
            git commit -m "data: κληρώσεις $(TZ=Europe/Athens date +%Y-%m-%d)"
            git push origin gh-pages
          )
