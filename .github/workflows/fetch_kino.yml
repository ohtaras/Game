name: Fetch KINO Results

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Ημερομηνία (YYYY-MM-DD)'
        required: true
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch KINO results
        run: python kino/fetch_kino.py "${{ github.event.inputs.date }}"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kino/data/
          git diff --staged --quiet || git commit -m "KINO results for ${{ github.event.inputs.date }}"
          git push
