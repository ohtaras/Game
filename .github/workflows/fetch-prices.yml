name: Fetch & Analyze

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - claude/setup-market-data-workflow-SlYwO

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests --quiet

      - name: Fetch candle data
        run: python scripts/fetch_candles.py

      - name: Run ICT analysis
        run: python scripts/analyze.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}
          git add data/candles/ data/signals/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "data: $(date -u '+%Y-%m-%dT%H:%MZ')"
          git push origin ${{ github.ref_name }}
