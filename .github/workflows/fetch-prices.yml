name: Fetch & Analyze

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - claude/setup-market-data-workflow-SlYwO
    paths:
      - '.github/workflows/fetch-prices.yml'

permissions:
  contents: write

concurrency:
  group: fetch-analyze
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync to latest remote
        run: |
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests --quiet

      - name: Fetch candle data
        run: python scripts/fetch_candles.py

      - name: Run ICT analysis
        run: python scripts/analyze.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/candles/ data/signals/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "data: $(date -u '+%Y-%m-%dT%H:%MZ')"
          git push origin ${{ github.ref_name }}

      - name: Trigger next run
        if: always()
        run: |
          sleep 270
          curl -s -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/fetch-prices.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}" || true
