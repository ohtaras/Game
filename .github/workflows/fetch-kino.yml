name: Fetch Kino draws

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-kino
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/fetch-kino.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "kino-bot"
          git config user.email "kino-bot@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "No new draws."
          else
            git commit -m "Auto-fetch Kino draws"
            git pull --rebase origin main
            git push
          fi
