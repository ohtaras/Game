<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧲 Μετά την Πιο Όμοια — KINO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a14;color:#e8e8e8;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5}
a{color:#64b5f6;text-decoration:none}
header{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid #1c1c2e;flex-wrap:wrap}
header h1{font-size:1.15rem;flex:1}
.nav-link{font-size:.8rem;color:#9fa8da;padding:4px 10px;border:1px solid #3a3a5a;border-radius:20px}
.nav-link:hover{background:#2a2a4a}
main{max-width:1900px;margin:0 auto;padding:14px}
#statusBar{padding:8px 14px;font-size:.8rem;color:#999;border-bottom:1px solid #1c1c2e}
#boards{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.board-wrap{margin-bottom:24px;flex:1 1 320px;min-width:280px}
.board-title{font-size:.95rem;font-weight:700;margin-bottom:4px}
.board-sub{font-size:.78rem;color:#999;margin-bottom:10px}
.board-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
@media(max-width:600px){.board-grid{grid-template-columns:repeat(5,1fr)}}
.board-cell{border-radius:7px;padding:10px 2px;text-align:center;font-size:.85rem;font-weight:700;background:#1e2535;border:2px solid #263040;color:#445;user-select:none}
.board-cell.on{background:#0d2b0d;border-color:#4caf50;color:#a5d6a7}
.board-cell.bonus{background:#3a1e0d;border-color:#ff9800;color:#ffcc80}
.board-cell .b-f{display:block;font-size:.55rem;opacity:.6}
.board-cell .b-n{display:block;font-size:.85rem;font-weight:700}
.board-cell .b-d{display:block;font-size:.62rem;margin-top:1px;opacity:.75}
#navRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px}
#navRow button{padding:9px 16px;border:none;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;background:#3949ab;color:#fff}
#navRow button:disabled{background:#2a2a3a;color:#666;cursor:default}
#navInfo{font-size:.78rem;color:#aaa}
#evalBox{font-size:.82rem;color:#a5d6a7;padding:0 14px 10px;line-height:1.6}
</style>
</head>
<body>

<header>
  <h1>🧲 Μετά την Πιο Όμοια — Και οι 3 Μαζί</h1>
  <a href="kino_predict.html" class="nav-link">← Πρόβλεψη</a>
</header>

<div id="statusBar">⏳ Φόρτωση ιστορικού…</div>

<div id="navRow">
  <button id="navBackBtn">◀ Προηγούμενη</button>
  <span id="navInfo">—</span>
  <button id="navFwdBtn">Επόμενη ▶</button>
  <button id="navLastBtn">Τελευταία ⏭</button>
  <label style="font-size:.78rem;color:#aaa">🔮 Χ αριθμοί: <input id="predXInput" type="number" min="1" max="80" value="20" style="width:56px;padding:4px 6px;border-radius:6px;border:1px solid #3a3a5a;background:#1e1e2e;color:#e8e8e8"></label>
</div>

<div id="evalBox"></div>

<main>
  <div id="boards"></div>
</main>

<script>
'use strict';
const REPO        = 'ohtaras/Game';
const DATA_BRANCH = 'main';
const OPAP_BASE   = 'https://api.opap.gr/draws/v3.0/1100';
const pad = n => String(n).padStart(2,'0');
const DRAWS_PER_DAY = 288;
const FIRST_DRAW_OF_DAY_OFFSET = 1305886 % DRAWS_PER_DAY;
function isFirstDrawOfDay(drawId) {
  return ((drawId % DRAWS_PER_DAY) + DRAWS_PER_DAY) % DRAWS_PER_DAY === FIRST_DRAW_OF_DAY_OFFSET;
}

async function apiFetch(url) {
  try { const r=await fetch(url,{headers:{Accept:'application/json'},signal:AbortSignal.timeout(12000)}); if(r.ok)return r.json(); } catch(_) {}
  try { const r=await fetch('https://corsproxy.io/?'+encodeURIComponent(url),{signal:AbortSignal.timeout(16000)}); if(r.ok)return r.json(); } catch(_) {}
  const r=await fetch('https://api.allorigins.win/get?url='+encodeURIComponent(url),{signal:AbortSignal.timeout(20000)});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return JSON.parse((await r.json()).contents);
}

function msToNext() {
  const now=new Date(), m=now.getMinutes(), s=now.getSeconds()+now.getMilliseconds()/1000;
  const cur5=Math.floor(m/5)*5;
  let diff=(cur5+5)*60+15-(m*60+s);
  if(diff<=0) diff+=300;
  return diff*1000;
}

function ghHeaders() {
  const t = localStorage.getItem('gh_token');
  return t ? { Authorization: 'token ' + t, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
}

async function ghGet(path) {
  const raw = `https://raw.githubusercontent.com/${REPO}/${DATA_BRANCH}/${path}`;
  try { const r = await fetch(raw, { cache: 'no-store', signal: AbortSignal.timeout(20000) }); if (r.ok) return r.json(); } catch(_) {}
  const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
  try {
    const r = await fetch(url, { headers: ghHeaders(), cache: 'no-store', signal: AbortSignal.timeout(30000) });
    if (!r.ok) return null;
    const meta = await r.json();
    if ((!meta.content || meta.content === '') && meta.download_url) {
      const dr = await fetch(meta.download_url, { cache: 'no-store', signal: AbortSignal.timeout(30000) });
      return dr.ok ? dr.json() : null;
    }
    if (!meta.content) return null;
    return JSON.parse(atob(meta.content.replace(/\n/g, '')));
  } catch(_) { return null; }
}

async function loadFullHistory() {
  const now = new Date();
  const months = [];
  for (let i = 0; i < 36; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(`${d.getFullYear()}_${pad(d.getMonth() + 1)}`);
  }
  const draws = [];
  for (const ym of months.reverse()) {
    document.getElementById('statusBar').textContent = `⏳ Φόρτωση ιστορικού: ${ym.replace('_','-')}… (${draws.length.toLocaleString('el-GR')} κληρώσεις μέχρι τώρα)`;
    const data = await ghGet(`data/raw/kino_raw_${ym}.json`);
    if (data?.draws) draws.push(...data.draws);
  }
  draws.sort((a, b) => a.id - b.id);
  return draws;
}

function renderBoard(title, sub, draw, delays, freqs) {
  const set = new Set(draw.n);
  const cells = [];
  for (let n = 1; n <= 80; n++) {
    let cls = 'board-cell';
    if (set.has(n)) cls += ' on';
    if (draw.b === n) cls += ' bonus';
    let inner = n;
    if (delays) {
      inner = `${freqs ? `<span class="b-f">${freqs[n]}</span>` : ''}<span class="b-n">${n}</span><span class="b-d">${delays[n]}</span>`;
    }
    cells.push(`<div class="${cls}">${inner}</div>`);
  }
  return `<div class="board-wrap">
    <div class="board-title">${title}</div>
    <div class="board-sub">${sub}</div>
    <div class="board-grid">${cells.join('')}</div>
  </div>`;
}

function computeDelaysAtIndex(draws, idx) {
  const delays = new Array(81).fill(null);
  let remaining = 80;
  for (let i = idx; i >= 0 && remaining > 0; i--) {
    for (const n of draws[i].n) {
      if (n >= 1 && n <= 80 && delays[n] === null) { delays[n] = idx - i; remaining--; }
    }
  }
  for (let n = 1; n <= 80; n++) if (delays[n] === null) delays[n] = idx + 1;
  return delays;
}

function computeFrequenciesAtIndex(draws, idx) {
  const freq = new Array(81).fill(0);
  let start = idx;
  while (start > 0 && !isFirstDrawOfDay(draws[start].id)) start--;
  for (let i = start; i <= idx; i++) {
    for (const n of draws[i].n) freq[n]++;
  }
  return freq;
}

function findSimilarNext(draws, idx) {
  const set = new Set(draws[idx].n);
  let bestIdx = -1, bestOverlap = -1;
  for (let i = idx - 1; i >= 0; i--) {
    const overlap = draws[i].n.reduce((s, n) => s + (set.has(n) ? 1 : 0), 0);
    if (overlap > bestOverlap) { bestOverlap = overlap; bestIdx = i; }
  }
  if (bestIdx < 0 || bestIdx + 1 >= draws.length) return null;
  return { similarIdx: bestIdx, similar: draws[bestIdx], overlap: bestOverlap, next: draws[bestIdx + 1] };
}

function predictByFrequency(freqArrays, x) {
  const sums = [];
  for (let n = 1; n <= 80; n++) {
    sums.push({ n, sum: freqArrays.reduce((s, f) => s + f[n], 0) });
  }
  sums.sort((a, b) => b.sum - a.sum || a.n - b.n);
  return sums.slice(0, x).map(s => s.n).sort((a, b) => a - b);
}

function predictAtIndex(draws, idx, x) {
  const sn = findSimilarNext(draws, idx);
  if (!sn) return { predicted: [], sn: null, lastFreqs: null, similarFreqs: null, nextFreqs: null };
  const lastFreqs = computeFrequenciesAtIndex(draws, idx);
  const similarFreqs = computeFrequenciesAtIndex(draws, sn.similarIdx);
  const nextFreqs = computeFrequenciesAtIndex(draws, sn.similarIdx + 1);
  const predicted = predictByFrequency([lastFreqs, similarFreqs, nextFreqs], x);
  return { predicted, sn, lastFreqs, similarFreqs, nextFreqs };
}

(async () => {
  let draws = await loadFullHistory();
  if (!draws.length) {
    document.getElementById('boards').innerHTML = '<div style="color:#ef9a9a">Δεν βρέθηκαν δεδομένα.</div>';
    return;
  }

  let viewIdx = -1; // -1 = follow latest

  function render() {
    const idx = viewIdx === -1 ? draws.length - 1 : viewIdx;
    const X = Math.min(80, Math.max(1, parseInt(document.getElementById('predXInput').value, 10) || 20));
    const last = draws[idx];
    const pr = predictAtIndex(draws, idx, X);
    const sn = pr.sn;
    const similar = sn?.similar || null;
    const next = sn?.next || null;
    const bestOverlap = sn?.overlap ?? 0;
    const predicted = pr.predicted;

    const actualNext = (idx + 1 < draws.length) ? draws[idx + 1] : null;
    let actualNextSub = actualNext ? `[${actualNext.n.join(', ')}]` : '';
    if (actualNext && predicted.length) {
      const actualNextSet = new Set(actualNext.n);
      const predMatch = predicted.filter(n => actualNextSet.has(n)).length;
      actualNextSub = `${predMatch}/${predicted.length} από την πρόβλεψη — ` + actualNextSub;
    }

    const lastDelays = computeDelaysAtIndex(draws, idx);
    const similarDelays = sn ? computeDelaysAtIndex(draws, sn.similarIdx) : null;
    const nextDelays = sn ? computeDelaysAtIndex(draws, sn.similarIdx + 1) : null;
    const actualNextDelays = actualNext ? computeDelaysAtIndex(draws, idx + 1) : null;

    const lastFreqs = pr.lastFreqs;
    const similarFreqs = pr.similarFreqs;
    const nextFreqs = pr.nextFreqs;
    const actualNextFreqs = actualNext ? computeFrequenciesAtIndex(draws, idx + 1) : null;

    const boards = document.getElementById('boards');
    boards.innerHTML =
      renderBoard(`Κλήρωση #${last.id}`, `[${last.n.join(', ')}]`, last, lastDelays, lastFreqs) +
      (similar ? renderBoard(`Πιο όμοια κλήρωση #${similar.id}`, `${bestOverlap}/20 κοινοί αριθμοί — [${similar.n.join(', ')}]`, similar, similarDelays, similarFreqs) : '') +
      (next ? renderBoard(`Επόμενη της πιο όμοιας #${next.id}`, `[${next.n.join(', ')}]`, next, nextDelays, nextFreqs) : '') +
      (predicted.length ? renderBoard(`🔮 Πρόβλεψη για την επόμενη (Top ${X} συχνότητας στους 3 πίνακες)`, `${predicted.length} αριθμοί — [${predicted.join(', ')}]`, { n: predicted, b: null }, lastDelays, lastFreqs) : '') +
      (actualNext ? renderBoard(`Πραγματική επόμενη κλήρωση #${actualNext.id}`, actualNextSub, actualNext, actualNextDelays, actualNextFreqs) : '');

    // Evaluation: compare the actual current draw with the 3-way "common numbers"
    // prediction that would have been made from the previous draw.
    const evalEl = document.getElementById('evalBox');
    if (idx > 0) {
      const prevSn = findSimilarNext(draws, idx - 1);
      if (prevSn) {
        const actualSet = new Set(last.n);
        const matchCount = prevSn.next.n.reduce((s, n) => s + (actualSet.has(n) ? 1 : 0), 0);
        let html = `🎯 Αξιολόγηση: η πρόβλεψη για την #${last.id} (βάσει της προηγούμενης #${draws[idx-1].id}) ήταν η #${prevSn.next.id} —
          <strong>${matchCount}/20 κοινοί</strong> με την πραγματική #${last.id}`;

        const prevPredicted = predictAtIndex(draws, idx - 1, X).predicted;
        if (prevPredicted.length) {
          const predMatch = prevPredicted.filter(n => actualSet.has(n)).length;
          html += `<br>🔮 Πρόβλεψη (Top ${X} συχνότητας — [${prevPredicted.join(', ')}]) για την #${last.id}: <strong>${predMatch}/${prevPredicted.length} βγήκαν</strong>`;
        }
        evalEl.innerHTML = html;
      } else {
        evalEl.textContent = '';
      }
    } else {
      evalEl.textContent = '';
    }

    document.getElementById('navInfo').textContent =
      `${idx + 1}/${draws.length}${viewIdx === -1 ? ' · ● ΖΩΝΤΑΝΑ (τελευταία)' : ''}`;
    document.getElementById('navBackBtn').disabled = idx <= 0;
    document.getElementById('navFwdBtn').disabled = idx >= draws.length - 1;
    document.getElementById('navLastBtn').disabled = viewIdx === -1;
  }

  function setStatus() {
    const last = draws[draws.length - 1];
    const sec = Math.round(msToNext() / 1000);
    const mm = pad(Math.floor(sec / 60)), ss = pad(sec % 60);
    document.getElementById('statusBar').textContent =
      `✓ ${draws.length.toLocaleString('el-GR')} κληρώσεις · τελευταία #${last.id} · ● ΖΩΝΤΑΝΑ · επόμενος έλεγχος: ${mm}:${ss}`;
  }

  async function checkForNewDraw() {
    try {
      const raw = await apiFetch(`${OPAP_BASE}/last-result-and-active`);
      const r = raw?.last;
      const lastId = draws[draws.length - 1].id;
      if (!r?.winningNumbers?.list?.length || r.drawId <= lastId) return;
      draws.push({ id: r.drawId, n: [...r.winningNumbers.list].sort((a,b) => a-b), b: (r.winningNumbers.bonus||[])[0] || null });
      render();
    } catch(_) {}
  }

  document.getElementById('navBackBtn').addEventListener('click', () => {
    const idx = viewIdx === -1 ? draws.length - 1 : viewIdx;
    if (idx > 0) { viewIdx = idx - 1; render(); }
  });
  document.getElementById('navFwdBtn').addEventListener('click', () => {
    const idx = viewIdx === -1 ? draws.length - 1 : viewIdx;
    if (idx < draws.length - 1) {
      viewIdx = idx + 1;
      if (viewIdx === draws.length - 1) viewIdx = -1;
      render();
    }
  });
  document.getElementById('navLastBtn').addEventListener('click', () => { viewIdx = -1; render(); });
  document.getElementById('predXInput').addEventListener('input', () => render());

  render();
  setStatus();
  setInterval(setStatus, 1000);
  setInterval(checkForNewDraw, msToNext() + 5000);
  setInterval(checkForNewDraw, 30000);
})();
</script>
</body>
</html>
