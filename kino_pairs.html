<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kino Δυάδες</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#111;color:#e8e8e8;min-height:100vh}
a{color:#64b5f6;text-decoration:none}
header{background:#1a1a2e;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #2a2a4a}
header h1{font-size:1.2rem;font-weight:700;color:#e0e0ff}
.nav-link{font-size:.8rem;color:#9fa8da;padding:4px 10px;border:1px solid #3a3a5a;border-radius:20px}
.nav-link:hover{background:#2a2a4a}
#statusBar{background:#0e0e1a;padding:8px 16px;font-size:.78rem;color:#888;border-bottom:1px solid #1a1a2e;min-height:32px}
main{max-width:1100px;margin:0 auto;padding:14px}
section{background:#1a1a2e;border-radius:10px;padding:14px;margin-bottom:12px}
section h2{font-size:.9rem;font-weight:600;color:#7986cb;margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}
.ctrl-label{font-size:.8rem;color:#aaa;display:flex;align-items:center;gap:6px}
.ctrl-input{background:#0e0e1a;border:1px solid #3a3a5a;border-radius:6px;color:#e8e8e8;padding:4px 8px;font-size:.85rem}
.btn{background:#26314a;border:1px solid #3a4a6a;color:#cfd8ff;border-radius:6px;padding:6px 10px;font-size:.78rem;cursor:pointer}
.btn:hover{background:#33446a}

/* ── Pair frequency table ── */
#dsControls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
#dsInfo{font-size:.78rem;color:#aaa;padding:0 6px;white-space:nowrap}
#pairFreqControls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
#pairFreqInfo{font-size:.78rem;color:#999;margin-bottom:6px}
#pairGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:3px;margin-bottom:10px}
.pair-cell{border-radius:5px;padding:4px 2px;text-align:center;user-select:none}
.pair-cell.hidden{background:#000;border-color:#000}
.pair-cell.hidden .pair-n,.pair-cell.hidden .pair-d{visibility:hidden}
.pair-cell .pair-n{font-size:.62rem;font-weight:700;display:block}
.pair-cell .pair-d{font-size:.55rem;display:block;margin-top:1px;opacity:.85}
.fr-0  {background:#1e2535;border:2px solid #3a4254;color:#aab}
.fr-1  {background:#2a3a1a;border:2px solid #5a8a2c;color:#c5e1a5}
.fr-2  {background:#3a4a14;border:2px solid #8aa81a;color:#dce775}
.fr-3  {background:#4a3209;border:2px solid #d68a0c;color:#ffb74d}
.fr-4p {background:#3a0d0d;border:2px solid #c62828;color:#ef9a9a}
.ds-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:#999;align-items:center}
.ds-legend-item{display:flex;align-items:center;gap:5px}
.ds-swatch{display:inline-block;width:16px;height:16px;border-radius:4px}
</style>
</head>
<body>

<header>
  <h1>👯 Συχνότητα Δυάδων</h1>
  <a href="kino_predict.html" class="nav-link">🔮 Πρόβλεψη</a>
  <a href="kino_live.html" class="nav-link">← Live</a>
  <a href="kino_similar.html" class="nav-link">🧲 Μετά την Πιο Όμοια</a>
  <a href="kino_frequency.html" class="nav-link">🌡 Συχνότητα Αριθμών</a>
  <a href="kino_settings.html" class="nav-link">⚙ Ρυθμίσεις</a>
</header>

<div id="statusBar">⏳ Φόρτωση δεδομένων…</div>

<main>
  <section>
    <h2>👯 Συχνότητα Δυάδων στις Τελευταίες Χ Κληρώσεις</h2>
    <div id="dsControls">
      <button class="btn" id="dsBackDayBtn">⏮ -1 ημ. (00:00)</button>
      <button class="btn" id="dsBackBtn">◀ Προηγούμενη</button>
      <span id="dsInfo">—</span>
      <button class="btn" id="dsFwdBtn">Επόμενη ▶</button>
      <button class="btn" id="dsFwdDayBtn">+1 ημ. (00:00) ⏭</button>
      <button class="btn" id="dsLastBtn">Τελευταία ⏭⏭</button>
    </div>
    <div id="pairFreqControls">
      <label class="ctrl-label">Τελευταίες
        <input type="number" id="pairFreqXInput" class="ctrl-input" value="6" min="1" max="100" style="width:60px">
        κληρώσεις
      </label>
      <label class="ctrl-label"><input type="checkbox" id="hideDelayChk"> Απόκρυψη δυάδων με καθυστέρηση ≥
        <input type="number" id="hideDelayXInput" class="ctrl-input" value="10" min="1" max="300" style="width:60px">
        κληρώσεις
      </label>
      <label class="ctrl-label"><input type="checkbox" id="hideFreqChk"> Απόκρυψη δυάδων με εμφανίσεις &lt;
        <input type="number" id="hideFreqXInput" class="ctrl-input" value="1" min="0" max="50" style="width:55px">
        φορές σε
        <select id="hideFreqModeSel" class="ctrl-input">
          <option value="today">ΣΗΜΕΡΑ (από 00:00)</option>
          <option value="lastx">τελευταίες</option>
        </select>
        <input type="number" id="hideFreqLastXInput" class="ctrl-input" value="100" min="1" max="1000" style="width:70px">
        κληρώσεις
      </label>
    </div>
    <div id="pairFreqInfo">—</div>
    <div id="pairGrid"><span style="color:#666;font-size:.8rem">Φόρτωση ιστορικού…</span></div>
    <div id="pairFreqLegend" class="ds-legend">
      <div class="ds-legend-item"><span class="ds-swatch fr-0"></span>καμία</div>
      <div class="ds-legend-item"><span class="ds-swatch fr-1"></span>1 φορά</div>
      <div class="ds-legend-item"><span class="ds-swatch fr-2"></span>2 φορές</div>
      <div class="ds-legend-item"><span class="ds-swatch fr-3"></span>3 φορές</div>
      <div class="ds-legend-item"><span class="ds-swatch fr-4p"></span>4+ φορές</div>
    </div>
  </section>
</main>

<script>
'use strict';

const REPO        = 'ohtaras/Game';
const DATA_BRANCH = 'main';
const OPAP_BASE   = 'https://api.opap.gr/draws/v3.0/1100';
const pad = n => String(n).padStart(2,'0');

async function apiFetch(url) {
  try { const r=await fetch(url,{headers:{Accept:'application/json'},signal:AbortSignal.timeout(12000)}); if(r.ok)return r.json(); } catch(_) {}
  try { const r=await fetch('https://corsproxy.io/?'+encodeURIComponent(url),{signal:AbortSignal.timeout(16000)}); if(r.ok)return r.json(); } catch(_) {}
  const r=await fetch('https://api.allorigins.win/get?url='+encodeURIComponent(url),{signal:AbortSignal.timeout(20000)});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return JSON.parse((await r.json()).contents);
}

function msToNext() {
  const now=new Date(), m=now.getMinutes(), s=now.getSeconds()+now.getMilliseconds()/1000;
  const cur5=Math.floor(m/5)*5;
  let diff=(cur5+5)*60+15-(m*60+s);
  if(diff<=0) diff+=300;
  return diff*1000;
}

function ghHeaders() {
  const t = localStorage.getItem('gh_token');
  return t ? { Authorization: 'token ' + t, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
}

async function ghGet(path) {
  const raw = `https://raw.githubusercontent.com/${REPO}/${DATA_BRANCH}/${path}`;
  try { const r = await fetch(raw, { cache: 'no-store', signal: AbortSignal.timeout(20000) }); if (r.ok) return r.json(); } catch(_) {}
  const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
  try {
    const r = await fetch(url, { headers: ghHeaders(), cache: 'no-store', signal: AbortSignal.timeout(30000) });
    if (!r.ok) return null;
    const meta = await r.json();
    if ((!meta.content || meta.content === '') && meta.download_url) {
      const dr = await fetch(meta.download_url, { cache: 'no-store', signal: AbortSignal.timeout(30000) });
      return dr.ok ? dr.json() : null;
    }
    if (!meta.content) return null;
    return JSON.parse(atob(meta.content.replace(/\n/g, '')));
  } catch(_) { return null; }
}

// ── Day boundaries ────────────────────────────────────────────────────────
const DRAWS_PER_DAY = 288;
const FIRST_DRAW_OF_DAY_OFFSET = 1305886 % DRAWS_PER_DAY;
function isFirstDrawOfDay(drawId) {
  return ((drawId % DRAWS_PER_DAY) + DRAWS_PER_DAY) % DRAWS_PER_DAY === FIRST_DRAW_OF_DAY_OFFSET;
}
function timeOfDay(drawId) {
  const slot = ((drawId - FIRST_DRAW_OF_DAY_OFFSET) % DRAWS_PER_DAY + DRAWS_PER_DAY) % DRAWS_PER_DAY;
  const mins = slot * 5;
  return `${pad(Math.floor(mins / 60))}:${pad(mins % 60)}`;
}
function dayStartIndex(draws, idx) {
  let start = idx;
  while (start > 0 && !isFirstDrawOfDay(draws[start].id)) start--;
  return start;
}

// ── Load full history ────────────────────────────────────────────────────
async function loadFullHistory(statusEl) {
  const now = new Date();
  const months = [];
  for (let i = 0; i < 36; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(`${d.getFullYear()}_${pad(d.getMonth() + 1)}`);
  }
  const draws = [];
  for (const ym of months.reverse()) {
    if (statusEl) statusEl.textContent = `⏳ Φόρτωση ιστορικού: ${ym.replace('_','-')}… (${draws.length.toLocaleString('el-GR')} κληρώσεις μέχρι τώρα)`;
    const data = await ghGet(`data/raw/kino_raw_${ym}.json`);
    if (data?.draws) draws.push(...data.draws);
  }
  draws.sort((a, b) => a.id - b.id);
  return draws;
}

// ── Pair frequency table ─────────────────────────────────────────────────
let dsDraws = null;
let dsIdx = -1;

const PAIRS = [];
for (let i = 1; i <= 80; i++) for (let j = i + 1; j <= 80; j++) PAIRS.push([i, j]);

function computePairFreqInLastX(draws, idx, X) {
  const counts = new Map();
  const start = Math.max(0, idx - X + 1);
  for (let i = start; i <= idx; i++) {
    const nums = draws[i].n.filter(n => n >= 1 && n <= 80).slice().sort((a, b) => a - b);
    for (let a = 0; a < nums.length; a++) {
      for (let b = a + 1; b < nums.length; b++) {
        const key = `${nums[a]}-${nums[b]}`;
        counts.set(key, (counts.get(key) || 0) + 1);
      }
    }
  }
  return counts;
}

function computePairDelaysAtIndex(draws, idx) {
  const delays = new Map();
  let remaining = PAIRS.length;
  for (let i = idx; i >= 0 && remaining > 0; i--) {
    const nums = draws[i].n.filter(n => n >= 1 && n <= 80).slice().sort((a, b) => a - b);
    for (let a = 0; a < nums.length; a++) {
      for (let b = a + 1; b < nums.length; b++) {
        const key = `${nums[a]}-${nums[b]}`;
        if (!delays.has(key)) { delays.set(key, idx - i); remaining--; }
      }
    }
  }
  return delays;
}

function freqBucketClass(c) {
  if (c <= 0) return 'fr-0';
  if (c === 1) return 'fr-1';
  if (c === 2) return 'fr-2';
  if (c === 3) return 'fr-3';
  return 'fr-4p';
}

function renderPairFreq() {
  if (!dsDraws || dsIdx < 0) return;
  const draw = dsDraws[dsIdx];
  const info = document.getElementById('dsInfo');
  const badge = isFirstDrawOfDay(draw.id) ? ' 🌅 00:00' : '';
  info.textContent = `#${draw.id} · ~${timeOfDay(draw.id)}${badge} (${dsIdx + 1}/${dsDraws.length})`;

  const grid = document.getElementById('pairGrid');
  const freqInfo = document.getElementById('pairFreqInfo');
  const X = Math.min(Math.max(parseInt(document.getElementById('pairFreqXInput').value) || 6, 1), 100);
  const freqs = computePairFreqInLastX(dsDraws, dsIdx, X);

  const hideDelay = document.getElementById('hideDelayChk').checked;
  const hideThreshold = Math.min(Math.max(parseInt(document.getElementById('hideDelayXInput').value) || 10, 1), 300);
  const delays = hideDelay ? computePairDelaysAtIndex(dsDraws, dsIdx) : null;

  const hideFreq = document.getElementById('hideFreqChk').checked;
  const hideFreqThreshold = Math.min(Math.max(parseInt(document.getElementById('hideFreqXInput').value) || 0, 0), 50);
  const hideFreqMode = document.getElementById('hideFreqModeSel').value;
  let hideFreqCounts = null;
  if (hideFreq) {
    if (hideFreqMode === 'today') {
      hideFreqCounts = computePairFreqInLastX(dsDraws, dsIdx, dsIdx - dayStartIndex(dsDraws, dsIdx) + 1);
    } else {
      const lastX = Math.min(Math.max(parseInt(document.getElementById('hideFreqLastXInput').value) || 100, 1), 1000);
      hideFreqCounts = computePairFreqInLastX(dsDraws, dsIdx, lastX);
    }
  }

  const cells = [];
  for (const [i, j] of PAIRS) {
    const key = `${i}-${j}`;
    const c = freqs.get(key) || 0;
    const delay = delays ? (delays.has(key) ? delays.get(key) : dsIdx + 1) : 0;
    const hc = hideFreqCounts ? (hideFreqCounts.get(key) || 0) : 0;
    const hidden = (delays && delay >= hideThreshold) || (hideFreqCounts && hc < hideFreqThreshold) ? ' hidden' : '';
    cells.push(`<div class="pair-cell ${freqBucketClass(c)}${hidden}"><span class="pair-n">${i}-${j}</span><span class="pair-d">${c}</span></div>`);
  }
  grid.innerHTML = cells.join('');
  const usedX = Math.min(X, dsIdx + 1);
  freqInfo.textContent = `#${draw.id} · ~${timeOfDay(draw.id)}${badge} — εμφανίσεις δυάδων στις τελευταίες ${usedX} κληρώσεις`;
}

function dsStep(delta) {
  if (!dsDraws) return;
  dsIdx = Math.min(Math.max(dsIdx + delta, 0), dsDraws.length - 1);
  renderPairFreq();
}

function dsJumpToFirstOfDay(direction) {
  if (!dsDraws) return;
  for (let i = dsIdx + direction; i >= 0 && i < dsDraws.length; i += direction) {
    if (isFirstDrawOfDay(dsDraws[i].id)) { dsIdx = i; renderPairFreq(); return; }
  }
}

// ── Live updates ──────────────────────────────────────────────────────────
async function checkForNewDraw() {
  try {
    if (!dsDraws || !dsDraws.length) return;
    const raw = await apiFetch(`${OPAP_BASE}/last-result-and-active`);
    const r = raw?.last;
    const last = dsDraws[dsDraws.length - 1];
    if (!r?.winningNumbers?.list?.length || r.drawId <= last.id) return;
    const newDraw = { id: r.drawId, n: [...r.winningNumbers.list].sort((a,b) => a-b), b: (r.winningNumbers.bonus||[])[0] || null };
    const wasAtLast = dsIdx === dsDraws.length - 1;
    dsDraws.push(newDraw);
    if (wasAtLast) { dsIdx = dsDraws.length - 1; renderPairFreq(); }
    updateStatus();
  } catch(e) { console.error('checkForNewDraw:', e); }
}

function schedulePoll() {
  setTimeout(() => { checkForNewDraw(); schedulePoll(); }, msToNext() + 5000);
}

function updateStatus() {
  const last = dsDraws?.[dsDraws.length - 1];
  document.getElementById('statusBar').textContent =
    `✓ ${dsDraws?.length.toLocaleString('el-GR') || 0} κληρώσεις · τελευταία #${last?.id || '—'} · ● ΖΩΝΤΑΝΑ`;
}

// ── Init ──────────────────────────────────────────────────────────────────
window.addEventListener('load', async () => {
  dsDraws = await loadFullHistory(document.getElementById('statusBar'));
  dsIdx = dsDraws.length - 1;
  renderPairFreq();
  updateStatus();
  checkForNewDraw();
  schedulePoll();

  document.getElementById('dsBackBtn').addEventListener('click', () => dsStep(-1));
  document.getElementById('dsFwdBtn').addEventListener('click', () => dsStep(1));
  document.getElementById('dsBackDayBtn').addEventListener('click', () => dsJumpToFirstOfDay(-1));
  document.getElementById('dsFwdDayBtn').addEventListener('click', () => dsJumpToFirstOfDay(1));
  document.getElementById('dsLastBtn').addEventListener('click', () => { if (dsDraws) { dsIdx = dsDraws.length - 1; renderPairFreq(); } });
  document.getElementById('pairFreqXInput').addEventListener('input', () => { if (dsDraws) renderPairFreq(); });
  document.getElementById('hideDelayChk').addEventListener('change', () => { if (dsDraws) renderPairFreq(); });
  document.getElementById('hideDelayXInput').addEventListener('input', () => { if (dsDraws) renderPairFreq(); });
  document.getElementById('hideFreqChk').addEventListener('change', () => { if (dsDraws) renderPairFreq(); });
  document.getElementById('hideFreqXInput').addEventListener('input', () => { if (dsDraws) renderPairFreq(); });
  document.getElementById('hideFreqLastXInput').addEventListener('input', () => { if (dsDraws) renderPairFreq(); });
  document.getElementById('hideFreqModeSel').addEventListener('change', () => {
    document.getElementById('hideFreqLastXInput').style.display = document.getElementById('hideFreqModeSel').value === 'lastx' ? '' : 'none';
    if (dsDraws) renderPairFreq();
  });
  document.getElementById('hideFreqLastXInput').style.display = document.getElementById('hideFreqModeSel').value === 'lastx' ? '' : 'none';
});
</script>

</body>
</html>
