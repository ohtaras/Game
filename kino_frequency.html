<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kino Συχνότητα</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#111;color:#e8e8e8;min-height:100vh}
a{color:#64b5f6;text-decoration:none}
header{background:#1a1a2e;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #2a2a4a}
header h1{font-size:1.2rem;font-weight:700;color:#e0e0ff}
.nav-link{font-size:.8rem;color:#9fa8da;padding:4px 10px;border:1px solid #3a3a5a;border-radius:20px}
.nav-link:hover{background:#2a2a4a}
#statusBar{background:#0e0e1a;padding:8px 16px;font-size:.78rem;color:#888;border-bottom:1px solid #1a1a2e;min-height:32px}
main{max-width:1100px;margin:0 auto;padding:14px}
section{background:#1a1a2e;border-radius:10px;padding:14px;margin-bottom:12px}
section h2{font-size:.9rem;font-weight:600;color:#7986cb;margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}
.ctrl-label{font-size:.8rem;color:#aaa;display:flex;align-items:center;gap:6px}
.ctrl-input{background:#0e0e1a;border:1px solid #3a3a5a;border-radius:6px;color:#e8e8e8;padding:4px 8px;font-size:.85rem}
.btn{background:#26314a;border:1px solid #3a4a6a;color:#cfd8ff;border-radius:6px;padding:6px 10px;font-size:.78rem;cursor:pointer}
.btn:hover{background:#33446a}

/* ── Frequency shift table ── */
#dsControls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
#dsInfo{font-size:.78rem;color:#aaa;padding:0 6px;white-space:nowrap}
#dsFreqControls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
#dsFreqInfo{font-size:.78rem;color:#999;margin-bottom:6px}
#dsFreqGrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:10px}
@media(max-width:600px){#dsFreqGrid{grid-template-columns:repeat(5,1fr)}}
.ds-cell{border-radius:7px;padding:6px 2px;text-align:center;user-select:none;cursor:pointer}
.ds-cell.selected{box-shadow:0 0 0 3px #ffd54f inset}
.ds-cell.hidden{background:#000;border-color:#000}
.ds-cell.hidden .ds-n,.ds-cell.hidden .ds-d{visibility:hidden}
.ds-cell .ds-n{font-size:.74rem;font-weight:700;display:block}
.ds-cell .ds-d{font-size:.6rem;display:block;margin-top:1px;opacity:.85}
.fr-0  {background:#1e2535;border:2px solid #3a4254;color:#aab}
.fr-1  {background:#2a3a1a;border:2px solid #5a8a2c;color:#c5e1a5}
.fr-2  {background:#3a4a14;border:2px solid #8aa81a;color:#dce775}
.fr-3  {background:#4a3209;border:2px solid #d68a0c;color:#ffb74d}
.fr-4p {background:#3a0d0d;border:2px solid #c62828;color:#ef9a9a}
.ds-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:#999;align-items:center}
.ds-legend-item{display:flex;align-items:center;gap:5px}
.ds-swatch{display:inline-block;width:16px;height:16px;border-radius:4px}

/* ── Predictions ── */
#predControls{margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#predHint{font-size:.78rem;color:#999}
#predList{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.pred-item{background:#0e0e1a;border:1px solid #2a2a4a;border-radius:8px;padding:8px 10px;font-size:.78rem;color:#aaa}
.pred-item .pred-title{color:#cfd8ff}
.pred-balls{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.pred-ball{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;background:#1e2535;border:2px solid #3a4254;font-size:.7rem;font-weight:700;color:#dde}
.pred-ball.hit{background:#0d2b0d;border-color:#4caf50;color:#a5d6a7}
.pred-ball.miss{background:#1a0808;border-color:#5a2a2a;color:#998}
</style>
</head>
<body>

<header>
  <h1>🌡 Συχνότητα Χ Κληρώσεων</h1>
  <a href="kino_predict.html" class="nav-link">🔮 Πρόβλεψη</a>
  <a href="kino_live.html" class="nav-link">← Live</a>
  <a href="kino_similar.html" class="nav-link">🧲 Μετά την Πιο Όμοια</a>
  <a href="kino_settings.html" class="nav-link">⚙ Ρυθμίσεις</a>
</header>

<div id="statusBar">⏳ Φόρτωση δεδομένων…</div>

<main>
  <section>
    <h2>🌡 Συχνότητα Αριθμών στις Τελευταίες Χ Κληρώσεις</h2>
    <div id="dsControls">
      <button class="btn" id="dsBackDayBtn">⏮ -1 ημ. (00:00)</button>
      <button class="btn" id="dsBackBtn">◀ Προηγούμενη</button>
      <span id="dsInfo">—</span>
      <button class="btn" id="dsFwdBtn">Επόμενη ▶</button>
      <button class="btn" id="dsFwdDayBtn">+1 ημ. (00:00) ⏭</button>
      <button class="btn" id="dsLastBtn">Τελευταία ⏭⏭</button>
    </div>
    <div id="dsFreqControls">
      <label class="ctrl-label">Τελευταίες
        <input type="number" id="dsFreqXInput" class="ctrl-input" value="6" min="1" max="100" style="width:60px">
        κληρώσεις
      </label>
      <label class="ctrl-label"><input type="checkbox" id="hideDelayChk"> Απόκρυψη αριθμών με καθυστέρηση ≥
        <input type="number" id="hideDelayXInput" class="ctrl-input" value="10" min="1" max="300" style="width:60px">
        κληρώσεις
      </label>
      <label class="ctrl-label"><input type="checkbox" id="hideFreqChk"> Απόκρυψη αριθμών με εμφανίσεις &lt;
        <input type="number" id="hideFreqXInput" class="ctrl-input" value="1" min="0" max="50" style="width:55px">
        φορές σε
        <select id="hideFreqModeSel" class="ctrl-input">
          <option value="today">ΣΗΜΕΡΑ (από 00:00)</option>
          <option value="lastx">τελευταίες</option>
        </select>
        <input type="number" id="hideFreqLastXInput" class="ctrl-input" value="100" min="1" max="1000" style="width:70px">
        κληρώσεις
      </label>
    </div>
    <div id="dsFreqInfo">—</div>
    <div id="dsFreqGrid"><span style="color:#666;font-size:.8rem">Φόρτωση ιστορικού…</span></div>
    <div id="dsFreqLegend" class="ds-legend">
      <div class="ds-legend-item"><span class="ds-swatch fr-0"></span>καμία</div>
      <div class="ds-legend-item"><span class="ds-swatch fr-1"></span>1 φορά</div>
      <div class="ds-legend-item"><span class="ds-swatch fr-2"></span>2 φορές</div>
      <div class="ds-legend-item"><span class="ds-swatch fr-3"></span>3 φορές</div>
      <div class="ds-legend-item"><span class="ds-swatch fr-4p"></span>4+ φορές</div>
    </div>

    <div id="predControls">
      <span id="predHint">🎯 Κάνε κλικ στους αριθμούς για να τους επιλέξεις ως πρόβλεψη για την επόμενη κλήρωση</span>
      <button class="btn" id="addPredBtn">🎯 Αποθήκευση Πρόβλεψης (<span id="predSelCount">0</span>)</button>
      <button class="btn" id="clearPredBtn">🗑 Καθάρισμα Προβλέψεων</button>
      <label class="ctrl-label"><input type="checkbox" id="autoPredChk"> Αυτόματη αποθήκευση στο "Επόμενη"</label>
      <label class="ctrl-label">Αξιολόγηση σε
        <input type="number" id="predEvalXInput" class="ctrl-input" value="1" min="1" max="20" style="width:55px">
        συνεχόμενες κληρώσεις
      </label>
    </div>
    <div id="predList"></div>
  </section>
</main>

<script>
'use strict';

const REPO        = 'ohtaras/Game';
const DATA_BRANCH = 'main';
const OPAP_BASE   = 'https://api.opap.gr/draws/v3.0/1100';
const pad = n => String(n).padStart(2,'0');

async function apiFetch(url) {
  try { const r=await fetch(url,{headers:{Accept:'application/json'},signal:AbortSignal.timeout(12000)}); if(r.ok)return r.json(); } catch(_) {}
  try { const r=await fetch('https://corsproxy.io/?'+encodeURIComponent(url),{signal:AbortSignal.timeout(16000)}); if(r.ok)return r.json(); } catch(_) {}
  const r=await fetch('https://api.allorigins.win/get?url='+encodeURIComponent(url),{signal:AbortSignal.timeout(20000)});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return JSON.parse((await r.json()).contents);
}

function msToNext() {
  const now=new Date(), m=now.getMinutes(), s=now.getSeconds()+now.getMilliseconds()/1000;
  const cur5=Math.floor(m/5)*5;
  let diff=(cur5+5)*60+15-(m*60+s);
  if(diff<=0) diff+=300;
  return diff*1000;
}

function ghHeaders() {
  const t = localStorage.getItem('gh_token');
  return t ? { Authorization: 'token ' + t, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
}

async function ghGet(path) {
  const raw = `https://raw.githubusercontent.com/${REPO}/${DATA_BRANCH}/${path}`;
  try { const r = await fetch(raw, { cache: 'no-store', signal: AbortSignal.timeout(20000) }); if (r.ok) return r.json(); } catch(_) {}
  const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
  try {
    const r = await fetch(url, { headers: ghHeaders(), cache: 'no-store', signal: AbortSignal.timeout(30000) });
    if (!r.ok) return null;
    const meta = await r.json();
    if ((!meta.content || meta.content === '') && meta.download_url) {
      const dr = await fetch(meta.download_url, { cache: 'no-store', signal: AbortSignal.timeout(30000) });
      return dr.ok ? dr.json() : null;
    }
    if (!meta.content) return null;
    return JSON.parse(atob(meta.content.replace(/\n/g, '')));
  } catch(_) { return null; }
}

// ── Day boundaries ────────────────────────────────────────────────────────
const DRAWS_PER_DAY = 288;
const FIRST_DRAW_OF_DAY_OFFSET = 1305886 % DRAWS_PER_DAY;
function isFirstDrawOfDay(drawId) {
  return ((drawId % DRAWS_PER_DAY) + DRAWS_PER_DAY) % DRAWS_PER_DAY === FIRST_DRAW_OF_DAY_OFFSET;
}
function timeOfDay(drawId) {
  const slot = ((drawId - FIRST_DRAW_OF_DAY_OFFSET) % DRAWS_PER_DAY + DRAWS_PER_DAY) % DRAWS_PER_DAY;
  const mins = slot * 5;
  return `${pad(Math.floor(mins / 60))}:${pad(mins % 60)}`;
}
function dayStartIndex(draws, idx) {
  let start = idx;
  while (start > 0 && !isFirstDrawOfDay(draws[start].id)) start--;
  return start;
}

// ── Load full history ────────────────────────────────────────────────────
async function loadFullHistory(statusEl) {
  const now = new Date();
  const months = [];
  for (let i = 0; i < 36; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(`${d.getFullYear()}_${pad(d.getMonth() + 1)}`);
  }
  const draws = [];
  for (const ym of months.reverse()) {
    if (statusEl) statusEl.textContent = `⏳ Φόρτωση ιστορικού: ${ym.replace('_','-')}… (${draws.length.toLocaleString('el-GR')} κληρώσεις μέχρι τώρα)`;
    const data = await ghGet(`data/raw/kino_raw_${ym}.json`);
    if (data?.draws) draws.push(...data.draws);
  }
  draws.sort((a, b) => a.id - b.id);
  return draws;
}

// ── Frequency shift table ────────────────────────────────────────────────
let dsDraws = null;
let dsIdx = -1;
let selectedNums = new Set();
let predictions = JSON.parse(localStorage.getItem('kino_freq_predictions') || '[]');

function computeFreqInLastX(draws, idx, X) {
  const freq = new Array(81).fill(0);
  const start = Math.max(0, idx - X + 1);
  for (let i = start; i <= idx; i++) {
    for (const n of draws[i].n) if (n >= 1 && n <= 80) freq[n]++;
  }
  return freq;
}

function computeFreqToday(draws, idx) {
  return computeFreqInLastX(draws, idx, idx - dayStartIndex(draws, idx) + 1);
}

function computeDelaysAtIndex(draws, idx) {
  const delays = new Array(81).fill(null);
  let remaining = 80;
  for (let i = idx; i >= 0 && remaining > 0; i--) {
    for (const n of draws[i].n) {
      if (n >= 1 && n <= 80 && delays[n] === null) { delays[n] = idx - i; remaining--; }
    }
  }
  for (let n = 1; n <= 80; n++) if (delays[n] === null) delays[n] = idx + 1;
  return delays;
}

function freqBucketClass(c) {
  if (c <= 0) return 'fr-0';
  if (c === 1) return 'fr-1';
  if (c === 2) return 'fr-2';
  if (c === 3) return 'fr-3';
  return 'fr-4p';
}

function renderFreqShift() {
  if (!dsDraws || dsIdx < 0) return;
  const draw = dsDraws[dsIdx];
  const info = document.getElementById('dsInfo');
  const badge = isFirstDrawOfDay(draw.id) ? ' 🌅 00:00' : '';
  info.textContent = `#${draw.id} · ~${timeOfDay(draw.id)}${badge} (${dsIdx + 1}/${dsDraws.length})`;

  const freqGrid = document.getElementById('dsFreqGrid');
  const freqInfo = document.getElementById('dsFreqInfo');
  const X = Math.min(Math.max(parseInt(document.getElementById('dsFreqXInput').value) || 6, 1), 100);
  const freqs = computeFreqInLastX(dsDraws, dsIdx, X);
  const hideDelay = document.getElementById('hideDelayChk').checked;
  const hideThreshold = Math.min(Math.max(parseInt(document.getElementById('hideDelayXInput').value) || 10, 1), 300);
  const delays = hideDelay ? computeDelaysAtIndex(dsDraws, dsIdx) : null;
  const hideFreq = document.getElementById('hideFreqChk').checked;
  const hideFreqThreshold = Math.min(Math.max(parseInt(document.getElementById('hideFreqXInput').value) || 0, 0), 50);
  const hideFreqMode = document.getElementById('hideFreqModeSel').value;
  let hideFreqCounts = null;
  if (hideFreq) {
    if (hideFreqMode === 'today') {
      hideFreqCounts = computeFreqToday(dsDraws, dsIdx);
    } else {
      const lastX = Math.min(Math.max(parseInt(document.getElementById('hideFreqLastXInput').value) || 100, 1), 1000);
      hideFreqCounts = computeFreqInLastX(dsDraws, dsIdx, lastX);
    }
  }
  const cells = [];
  for (let n = 1; n <= 80; n++) {
    const sel = selectedNums.has(n) ? ' selected' : '';
    const hidden = (delays && delays[n] >= hideThreshold) || (hideFreqCounts && hideFreqCounts[n] < hideFreqThreshold) ? ' hidden' : '';
    cells.push(`<div class="ds-cell ${freqBucketClass(freqs[n])}${sel}${hidden}" data-n="${n}"><span class="ds-n">${n}</span><span class="ds-d">${freqs[n]}</span></div>`);
  }
  freqGrid.innerHTML = cells.join('');
  const usedX = Math.min(X, dsIdx + 1);
  freqInfo.textContent = `#${draw.id} · ~${timeOfDay(draw.id)}${badge} — εμφανίσεις στις τελευταίες ${usedX} κληρώσεις`;
  document.getElementById('predSelCount').textContent = selectedNums.size;
}

// ── Predictions ──────────────────────────────────────────────────────────
function savePredictions() {
  localStorage.setItem('kino_freq_predictions', JSON.stringify(predictions));
}

function toggleSelectNum(n) {
  if (selectedNums.has(n)) selectedNums.delete(n); else selectedNums.add(n);
  renderFreqShift();
}

function addPrediction() {
  if (!selectedNums.size || !dsDraws || dsIdx < 0) return;
  const forDrawId = dsDraws[dsIdx].id + 1;
  const evalX = Math.min(Math.max(parseInt(document.getElementById('predEvalXInput').value) || 1, 1), 20);
  predictions.push({ forDrawId, evalX, nums: [...selectedNums].sort((a,b) => a-b), evaluated: false, hits: [] });
  selectedNums.clear();
  savePredictions();
  renderFreqShift();
  evaluatePredictions();
  renderPredictions();
}

function clearPredictions() {
  if (!predictions.length) return;
  if (!confirm('Διαγραφή όλων των προβλέψεων;')) return;
  predictions = [];
  savePredictions();
  renderPredictions();
}

function evaluatePredictions() {
  if (!dsDraws || !predictions.length) return;
  let changed = false;
  const drawById = new Map(dsDraws.map(d => [d.id, d]));
  for (const p of predictions) {
    const evalX = p.evalX || 1;
    if (p.evaluated && (evalX === 1 || p.bestDrawId)) continue;
    const windowDraws = [];
    for (let i = 0; i < evalX; i++) {
      const draw = drawById.get(p.forDrawId + i);
      if (!draw) { windowDraws.length = 0; break; }
      windowDraws.push(draw);
    }
    if (windowDraws.length !== evalX) continue;
    let bestDraw = windowDraws[0], bestHits = p.nums.filter(n => bestDraw.n.includes(n));
    for (const d of windowDraws.slice(1)) {
      const h = p.nums.filter(n => d.n.includes(n));
      if (h.length > bestHits.length) { bestDraw = d; bestHits = h; }
    }
    p.hits = bestHits;
    p.bestDrawId = bestDraw.id;
    p.evaluated = true;
    changed = true;
  }
  if (changed) { savePredictions(); renderPredictions(); }
}

function renderPredictions() {
  const list = document.getElementById('predList');
  if (!predictions.length) { list.innerHTML = ''; return; }
  const sorted = [...predictions].sort((a, b) => b.forDrawId - a.forDrawId);
  list.innerHTML = sorted.map(p => {
    const evalX = p.evalX || 1;
    const range = evalX > 1 ? `#${p.forDrawId}–#${p.forDrawId + evalX - 1}` : `#${p.forDrawId}`;
    let statusText = '⏳ Εκκρεμεί';
    let balls = p.nums.map(n => `<span class="pred-ball">${n}</span>`).join('');
    if (p.evaluated) {
      statusText = evalX > 1
        ? `✓ Μέγιστο ${p.hits.length}/${p.nums.length} σωστά (κλήρωση #${p.bestDrawId})`
        : `✓ ${p.hits.length}/${p.nums.length} σωστά`;
      balls = p.nums.map(n => `<span class="pred-ball ${p.hits.includes(n) ? 'hit' : 'miss'}">${n}</span>`).join('');
    }
    return `<div class="pred-item"><div class="pred-title">Πρόβλεψη για κλήρωση ${range} — ${statusText}</div><div class="pred-balls">${balls}</div></div>`;
  }).join('');
}

function dsStep(delta) {
  if (!dsDraws) return;
  if (delta > 0 && selectedNums.size && document.getElementById('autoPredChk').checked) {
    addPrediction();
  }
  dsIdx = Math.min(Math.max(dsIdx + delta, 0), dsDraws.length - 1);
  renderFreqShift();
  evaluatePredictions();
}

function dsJumpToFirstOfDay(direction) {
  if (!dsDraws) return;
  for (let i = dsIdx + direction; i >= 0 && i < dsDraws.length; i += direction) {
    if (isFirstDrawOfDay(dsDraws[i].id)) { dsIdx = i; renderFreqShift(); evaluatePredictions(); return; }
  }
}

// ── Live updates ──────────────────────────────────────────────────────────
async function checkForNewDraw() {
  try {
    if (!dsDraws || !dsDraws.length) return;
    const raw = await apiFetch(`${OPAP_BASE}/last-result-and-active`);
    const r = raw?.last;
    const last = dsDraws[dsDraws.length - 1];
    if (!r?.winningNumbers?.list?.length || r.drawId <= last.id) return;
    const newDraw = { id: r.drawId, n: [...r.winningNumbers.list].sort((a,b) => a-b), b: (r.winningNumbers.bonus||[])[0] || null };
    const wasAtLast = dsIdx === dsDraws.length - 1;
    dsDraws.push(newDraw);
    if (wasAtLast) { dsIdx = dsDraws.length - 1; renderFreqShift(); }
    evaluatePredictions();
    updateStatus();
  } catch(e) { console.error('checkForNewDraw:', e); }
}

function schedulePoll() {
  setTimeout(() => { checkForNewDraw(); schedulePoll(); }, msToNext() + 5000);
}

function updateStatus() {
  const last = dsDraws?.[dsDraws.length - 1];
  document.getElementById('statusBar').textContent =
    `✓ ${dsDraws?.length.toLocaleString('el-GR') || 0} κληρώσεις · τελευταία #${last?.id || '—'} · ● ΖΩΝΤΑΝΑ`;
}

// ── Init ──────────────────────────────────────────────────────────────────
window.addEventListener('load', async () => {
  dsDraws = await loadFullHistory(document.getElementById('statusBar'));
  dsIdx = dsDraws.length - 1;
  renderFreqShift();
  evaluatePredictions();
  renderPredictions();
  updateStatus();
  checkForNewDraw();
  schedulePoll();

  document.getElementById('dsBackBtn').addEventListener('click', () => dsStep(-1));
  document.getElementById('dsFwdBtn').addEventListener('click', () => dsStep(1));
  document.getElementById('dsBackDayBtn').addEventListener('click', () => dsJumpToFirstOfDay(-1));
  document.getElementById('dsFwdDayBtn').addEventListener('click', () => dsJumpToFirstOfDay(1));
  document.getElementById('dsLastBtn').addEventListener('click', () => { if (dsDraws) { dsIdx = dsDraws.length - 1; renderFreqShift(); } });
  document.getElementById('dsFreqXInput').addEventListener('input', () => { if (dsDraws) renderFreqShift(); });
  document.getElementById('hideDelayChk').addEventListener('change', () => { if (dsDraws) renderFreqShift(); });
  document.getElementById('hideDelayXInput').addEventListener('input', () => { if (dsDraws) renderFreqShift(); });
  document.getElementById('hideFreqChk').addEventListener('change', () => { if (dsDraws) renderFreqShift(); });
  document.getElementById('hideFreqXInput').addEventListener('input', () => { if (dsDraws) renderFreqShift(); });
  document.getElementById('hideFreqLastXInput').addEventListener('input', () => { if (dsDraws) renderFreqShift(); });
  document.getElementById('hideFreqModeSel').addEventListener('change', () => {
    document.getElementById('hideFreqLastXInput').style.display = document.getElementById('hideFreqModeSel').value === 'lastx' ? '' : 'none';
    if (dsDraws) renderFreqShift();
  });
  document.getElementById('hideFreqLastXInput').style.display = document.getElementById('hideFreqModeSel').value === 'lastx' ? '' : 'none';
  document.getElementById('dsFreqGrid').addEventListener('click', (e) => {
    const cell = e.target.closest('.ds-cell');
    if (!cell) return;
    toggleSelectNum(parseInt(cell.dataset.n, 10));
  });
  document.getElementById('addPredBtn').addEventListener('click', addPrediction);
  document.getElementById('clearPredBtn').addEventListener('click', clearPredictions);
});
</script>

</body>
</html>
