<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kino Live</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#111;color:#e8e8e8;min-height:100vh}
a{color:#64b5f6;text-decoration:none}

/* ── Header ── */
header{background:#1a1a2e;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #2a2a4a}
header h1{font-size:1.2rem;font-weight:700;color:#e0e0ff}
.badge{padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:700;letter-spacing:.04em}
.badge.on{background:#1b5e20;color:#a5d6a7;animation:pulse 2s infinite}
.badge.off{background:#333;color:#888}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
#countdown{font-size:.8rem;color:#aaa;margin-left:auto}

/* ── Header settings link ── */
#settingsLink{font-size:.8rem;color:#9fa8da;padding:4px 10px;border:1px solid #3a3a5a;border-radius:20px}
#settingsLink:hover{background:#2a2a4a}
/* ── Token bar ── */
#tokenBar{background:#1a1a2e;padding:8px 16px;border-bottom:1px solid #2a2a4a;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.78rem}
#tokenState{color:#aaa}

/* ── Main layout ── */
main{max-width:1100px;margin:0 auto;padding:12px 12px}
section{background:#1a1a2e;border-radius:10px;padding:14px;margin-bottom:12px}
section h2{font-size:.9rem;font-weight:600;color:#7986cb;margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}

/* ── Current draw ── */
#drawCard{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
#drawMeta{font-size:.8rem;color:#aaa;min-width:160px}
#drawMeta strong{display:block;font-size:1rem;color:#fff;margin-bottom:4px}
.num-grid{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.num-ball{width:36px;height:36px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;background:#263238;color:#b0bec5;border:2px solid #37474f;cursor:default}
.num-ball.drawn{background:#1a2744;color:#e8eaf6;border-color:#37474f}
.num-ball.letter{background:#1a237e;color:#c5cae9;border-color:#3949ab}
.num-ball.lower{background:#1b3a4a;color:#b2dfdb;border-color:#26747a}
.num-ball.accent{background:#4a1232;color:#f8bbd0;border-color:#880e4f}
.num-ball.cluster{background:#1b3a1a;color:#c8e6c9;border-color:#2e7d32}
.num-ball.diph{background:#263238;color:#80cbc4;border-color:#00695c}
#drawLettersLine{font-size:1rem;color:#ce93d8;margin-top:6px;font-family:monospace;letter-spacing:.12em;word-break:break-all}

/* ── Delay table ── */
#delayGrid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.d-cell{border-radius:5px;padding:4px 2px;text-align:center;cursor:default;transition:transform .1s}
.d-cell:hover{transform:scale(1.15);z-index:1;position:relative}
.d-num{font-size:.68rem;font-weight:700;display:block}
.d-val{font-size:.62rem;display:block;opacity:.85}

#saveStatus{font-size:.75rem;color:#aaa;padding:4px 0}

/* ── Word lookup ── */
#lookupBox{display:flex;gap:8px;flex-wrap:wrap}
#wordInput{flex:1;min-width:180px;padding:9px 12px;background:#0e0e1a;border:1px solid #3a3a5a;border-radius:8px;color:#e8e8e8;font-size:1rem;outline:none}
#wordInput:focus{border-color:#5c6bc0}
#lookupBtn{padding:9px 18px;border:none;border-radius:8px;background:#3949ab;color:#fff;font-size:.85rem;font-weight:600;cursor:pointer}
#lookupBtn:hover{background:#3f51b5}
#lookupResult{margin-top:10px}
.lk-tiles{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.lk-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:38px;padding:5px 7px;border-radius:8px;background:#1a2744;border:2px solid #37474f}
.lk-tile .lk-c{font-size:.8rem;font-weight:700;color:#e8eaf6}
.lk-tile .lk-n{font-size:.7rem;color:#9fa8da;font-weight:700}
.lk-nums{margin-top:8px;font-size:.9rem;color:#b39ddb;font-family:monospace;letter-spacing:.06em}
.lk-warn{font-size:.8rem;color:#ef9a9a;margin-top:6px}

/* ── Auto sentence ── */
#autoSentence{font-size:1.15rem;line-height:1.6;color:#e8eaf6;background:#0f1117;border-radius:8px;padding:14px 16px;border-left:3px solid #7986cb;font-style:italic}
#autoSentence .as-meta{display:block;font-size:.72rem;color:#666;margin-top:8px;font-style:normal}

/* ── Responsive ── */
@media(max-width:600px){
  #delayGrid{grid-template-columns:repeat(8,1fr)}
}
</style>
</head>
<body>

<header>
  <h1>🎱 Kino Live</h1>
  <span id="liveBadge" class="badge off">⏸ ΕΚΤΟΣ</span>
  <a href="kino_settings.html" id="settingsLink" title="Ρυθμίσεις">⚙ Ρυθμίσεις</a>
  <span id="countdown"></span>
</header>

<div id="tokenBar">
  <span id="tokenState"></span>
  <a href="kino_settings.html">Άνοιγμα ρυθμίσεων →</a>
</div>

<main>
  <!-- Current Draw -->
  <section id="drawSec">
    <h2>Τρέχουσα Κλήρωση</h2>
    <div id="drawCard">
      <div id="drawMeta"><strong id="drawId">—</strong><span id="drawTime">Φόρτωση...</span></div>
      <div style="flex:1">
        <div class="num-grid" id="numGrid"></div>
        <div id="drawLettersLine"></div>
      </div>
    </div>
    <div id="saveStatus"></div>
  </section>

  <!-- Delay Table -->
  <section id="delaySec">
    <h2>Καθυστερήσεις (κληρώσεις απουσίας ανά αριθμό)</h2>
    <div id="delayGrid"><span style="color:#666;font-size:.8rem">Φόρτωση ιστορικών δεδομένων...</span></div>
  </section>

  <!-- Word → Numbers lookup -->
  <section id="lookupSec">
    <h2>Λέξη → Αριθμοί</h2>
    <div id="lookupBox">
      <input type="text" id="wordInput" placeholder="Γράψε μια λέξη (π.χ. ΝΙΚΗ)" autocomplete="off" spellcheck="false">
      <button id="lookupBtn">Ανάλυση</button>
    </div>
    <div id="lookupResult"></div>
  </section>

  <!-- Auto-composed sentence -->
  <section id="sentenceSec">
    <h2>Πρόταση από την κλήρωση (Claude)</h2>
    <div id="autoSentence">—</div>
  </section>
</main>

<script>
'use strict';
// ── Constants ──────────────────────────────────────────────────────────────
const REPO        = 'ohtaras/Game';
const DATA_BRANCH = 'main';
const OPAP_BASE   = 'https://api.opap.gr/draws/v3.0/1100';
const TZ_MS       = 3 * 3600 * 1000;           // Athens UTC+3
const LIVE_BASE_MS= Date.UTC(2024, 11, 31, 22, 0, 0); // 2025-01-01 00:00 EET
const LIVE_BASE_ID= 1155022;
const pad = n => String(n).padStart(2,'0');
function estDrawId(){ return LIVE_BASE_ID + Math.floor((Date.now() - LIVE_BASE_MS) / 300000); }

// ── Full 1-80 character mapping (frequency-aligned, 240K draws) ────────────
const NUM_TO_CHAR = [
  null,
  'ευ','τρ','Ξ','Χ','η','αυ','χτ','ψ','λλ','τ',     // 1-10
  'μπ','Υ','γ','φ','οι','κ','Ω','Ο','Ψ','σκ',        // 11-20
  'Η','ο','αι','Α','Δ','Ρ','χ','ρχ','ντ','Γ',        // 21-30
  'ν','θ','σ','δ','χρ','Σ','Τ','π','ξ','μ',          // 31-40
  'υ','Φ','τσ','λ','ό','Λ','ή','Μ','θρ','στ',        // 41-50
  'ζ','ου','α','Ζ','ει','σπ','κτ','νδ','β','Κ',      // 51-60
  'γκ','ύ','ρ','ω','Ε','σσ','ί','Β','Ι','φτ',        // 61-70
  'Ν','γγ','ε','ά','Π','πρ','ώ','Θ','ι','έ'          // 71-80
];
// Reverse: lowercase string → number (lowercase wins over uppercase)
const CHAR_TO_NUM = {};
for (let n=1; n<=80; n++) {
  const c = NUM_TO_CHAR[n], key = c.toLowerCase();
  if (c === key || !CHAR_TO_NUM[key]) CHAR_TO_NUM[key] = n;
}
CHAR_TO_NUM['ς'] = CHAR_TO_NUM['σ']; // final sigma alias
// Sorted longest-first for greedy word decomposition
const PATTERNS = Object.keys(CHAR_TO_NUM).sort((a,b) => b.length - a.length);

// ── State ──────────────────────────────────────────────────────────────────
let liveRunning      = false;
let liveTimerId      = null;
let liveCountdownId  = null;
let lastDrawId       = 0;
let drawCounter      = 0;
let lastSeen         = new Array(81).fill(-1);
let delays           = new Array(81).fill(0);
let delaysReady      = false;
let saveLock         = false;
let liveBuffer       = new Map();
let liveLastSavedCount = 0;

// ── Utilities ──────────────────────────────────────────────────────────────
function ghHeaders() {
  const t = localStorage.getItem('gh_token');
  return t ? {Authorization:'token '+t,'Content-Type':'application/json'} : {'Content-Type':'application/json'};
}

function refreshTokenState() {
  const gh = !!localStorage.getItem('gh_token');
  const cl = !!localStorage.getItem('claude_api_key');
  const parts = [];
  parts.push(gh ? '🔑 GitHub token ✓ (αυτόματη αποθήκευση)' : '⚠ Χωρίς GitHub token (καμία αποθήκευση)');
  parts.push(cl ? '✦ Claude key ✓ (AI πρόταση)' : '✦ Χωρίς Claude key (χωρίς AI πρόταση)');
  document.getElementById('tokenState').textContent = parts.join('  ·  ');
}

async function apiFetch(url) {
  try { const r=await fetch(url,{headers:{Accept:'application/json'},signal:AbortSignal.timeout(12000)}); if(r.ok)return r.json(); } catch(_) {}
  try { const r=await fetch('https://corsproxy.io/?'+encodeURIComponent(url),{signal:AbortSignal.timeout(16000)}); if(r.ok)return r.json(); } catch(_) {}
  const r=await fetch('https://api.allorigins.win/get?url='+encodeURIComponent(url),{signal:AbortSignal.timeout(20000)});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return JSON.parse((await r.json()).contents);
}

async function ghGet(path) {
  const raw = `https://raw.githubusercontent.com/${REPO}/${DATA_BRANCH}/${path}`;
  try { const r=await fetch(raw,{cache:'no-store',signal:AbortSignal.timeout(20000)}); if(r.ok)return r.json(); } catch(_) {}
  const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
  try {
    const r=await fetch(url,{headers:ghHeaders(),cache:'no-store',signal:AbortSignal.timeout(30000)});
    if(!r.ok) return null;
    const meta=await r.json();
    if((!meta.content||meta.content==='')&&meta.download_url) {
      const dr=await fetch(meta.download_url,{cache:'no-store',signal:AbortSignal.timeout(30000)});
      return dr.ok?dr.json():null;
    }
    if(!meta.content) return null;
    return JSON.parse(atob(meta.content.replace(/\n/g,'')));
  } catch(_) { return null; }
}

async function ghPut(path, obj, message) {
  const h=ghHeaders(), url=`https://api.github.com/repos/${REPO}/contents/${path}`;
  const b64=btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
  for(let attempt=0; attempt<3; attempt++) {
    let sha;
    const chk=await fetch(url+'?ref='+encodeURIComponent(DATA_BRANCH),{headers:h,cache:'no-store'});
    if(chk.ok) { const ex=await chk.json(); sha=ex.sha; }
    const r=await fetch(url,{method:'PUT',headers:h,body:JSON.stringify({message,content:b64,branch:DATA_BRANCH,...(sha?{sha}:{})}),signal:AbortSignal.timeout(60000)});
    if(r.ok) return;
    if(r.status===409) { await new Promise(res=>setTimeout(res,1200)); continue; }
    throw new Error('GitHub API '+r.status);
  }
  throw new Error('Αποτυχία εγγραφής μετά από 3 προσπάθειες');
}

function toMs(t) { return t>1e11?t:t*1000; }

function localTimeStr(ms) {
  return new Date(ms).toLocaleTimeString('el-GR',{timeZone:'Europe/Athens',hour:'2-digit',minute:'2-digit'});
}

function normWord(word) {
  return word.toLowerCase().replace(/ς/g,'σ');
}

// Strict Scrabble check: can `word` be spelled from tile multiset `avail`?
function spellWord(word, avail) {
  function dfs(i) {
    if (i === word.length) return true;
    for (const t of PATTERNS) {
      if (t.length > word.length - i) continue;
      if ((avail.get(t)||0) <= 0) continue;
      if (!word.startsWith(t, i)) continue;
      avail.set(t, avail.get(t) - 1);
      if (dfs(i + t.length)) return true;
      avail.set(t, avail.get(t) + 1);
    }
    return false;
  }
  return dfs(0);
}

function drawTileMultiset(nums) {
  const m = new Map();
  for (const n of nums) {
    const c = NUM_TO_CHAR[n]; if (!c) continue;
    m.set(c.toLowerCase(), (m.get(c.toLowerCase())||0) + 1);
  }
  return m;
}

function delayColor(d) {
  const t = Math.min(d / 60, 1);
  const hue = Math.round(120 * (1 - t));
  const sat = 80, lig = t < 0.5 ? 42 : 38;
  return `hsl(${hue},${sat}%,${lig}%)`;
}

function fmtMs(ms) {
  const s = Math.round(ms / 1000);
  return `${pad(Math.floor(s/60))}:${pad(s%60)}`;
}

// ── Timer helper ──────────────────────────────────────────────────────────
function msToNext() {
  const now = new Date(), m = now.getMinutes(), s = now.getSeconds() + now.getMilliseconds()/1000;
  const cur5 = Math.floor(m/5)*5;
  let diff = (cur5+5)*60 + 15 - (m*60+s);
  if (diff <= 0) diff += 300;
  return diff * 1000;
}

// ── Historical delays ──────────────────────────────────────────────────────
async function loadHistoricalDelays() {
  const now = new Date();
  const months = [];
  for (let i=0; i<3; i++) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push(`${d.getFullYear()}_${pad(d.getMonth()+1)}`);
  }

  let allDraws = [];
  for (const ym of months) {
    const data = await ghGet(`data/raw/kino_raw_${ym}.json`);
    if (data?.draws) allDraws.push(...data.draws);
  }
  allDraws.sort((a,b)=>a.id-b.id);

  const hist = new Array(81).fill(-1);
  for (let i=0; i<allDraws.length; i++) {
    for (const n of allDraws[i].n) if (n>=1&&n<=80) hist[n] = i;
  }
  const total = allDraws.length;
  for (let n=1; n<=80; n++) {
    delays[n] = hist[n]===-1 ? total : total - hist[n];
    lastSeen[n] = hist[n];
  }
  drawCounter = total;

  if (allDraws.length) lastDrawId = allDraws[allDraws.length-1].id;
  delaysReady = true;
  renderDelayTable();
}

// ── Gap-fill: fetch last N days from OPAP and save any missing draws ───────
async function gapFill(days=3) {
  if (!localStorage.getItem('gh_token')) return;
  const el = document.getElementById('saveStatus');
  el.textContent = '⏳ Έλεγχος κληρώσεων τελευταίων ' + days + ' ημερών...';
  try {
    const byMonth = {};
    for (let d=0; d<days; d++) {
      const dt = new Date(Date.now() - d * 86400000);
      const dayStr = `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
      const items = await fetchDaySeq(dayStr);
      for (const item of items) {
        if (!item.winningNumbers?.list?.length) continue;
        const id = item.drawId;
        const dayN = Math.floor((id - LIVE_BASE_ID) / 288);
        const dt2 = new Date(Date.UTC(2025, 0, 1) + dayN * 86400000);
        const ym = `${dt2.getUTCFullYear()}_${pad(dt2.getUTCMonth()+1)}`;
        if (!byMonth[ym]) byMonth[ym] = [];
        byMonth[ym].push({id, n:[...item.winningNumbers.list].sort((a,b)=>a-b), b:(item.winningNumbers.bonus||[])[0]||null});
      }
    }
    let totalNew = 0;
    for (const [ym, draws] of Object.entries(byMonth)) {
      const path = `data/raw/kino_raw_${ym}.json`;
      const mStr = ym.replace('_','-');
      const existing = await ghGet(path) || {month:mStr, draws:[]};
      const exIds = new Set(existing.draws.map(d=>d.id));
      const newOnes = draws.filter(d=>!exIds.has(d.id));
      if (!newOnes.length) continue;
      const merged = [...existing.draws, ...newOnes].sort((a,b)=>a.id-b.id);
      await ghPut(path, {month:mStr, draws:merged}, `Gap-fill: +${newOnes.length} ${mStr}`);
      totalNew += newOnes.length;
    }
    el.textContent = totalNew > 0
      ? `✓ Gap-fill: ${totalNew} νέες κληρώσεις αποθηκεύτηκαν`
      : '✓ Gap-fill: όλα ενημερωμένα';
  } catch(e) {
    el.textContent = '⚠ Gap-fill σφάλμα: ' + e.message;
    console.error('gapFill error:', e);
  }
}

async function fetchDaySeq(dayStr, size=10) {
  let items=[], page=0;
  while(true) {
    const url = `${OPAP_BASE}/draw-date/${dayStr}/${dayStr}?page=${page}&size=${size}`;
    let raw=null;
    try { raw = await apiFetch(url); } catch(_) {}
    if (!raw) break;
    const pg = Array.isArray(raw) ? raw : (raw.content || raw.draws || []);
    items = items.concat(pg);
    if (Array.isArray(raw) || raw.last===true || pg.length===0 || pg.length<size) break;
    page++;
    if (page>35) break;
  }
  return items;
}

// ── Delay table rendering ──────────────────────────────────────────────────
function renderDelayTable() {
  const grid = document.getElementById('delayGrid');
  const cells = [];
  for (let n=1; n<=80; n++) {
    const d = delays[n];
    const bg = delayColor(d);
    cells.push(`<div class="d-cell" style="background:${bg}" title="#${n} — ${d} κληρώσεις απόντος">
      <span class="d-num">${n}</span>
      <span class="d-val">${d}</span>
    </div>`);
  }
  grid.innerHTML = cells.join('');
}

// ── Claude API (browser-direct) ────────────────────────────────────────────
async function anthropicFetch(apiKey, model, sys, messages, maxTokens) {
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({model, max_tokens: maxTokens, system: sys, messages}),
    signal: AbortSignal.timeout(30000)
  });
  if (!resp.ok) { const t = await resp.text().catch(()=> ''); throw new Error(resp.status + ': ' + t.slice(0,150)); }
  const data = await resp.json();
  try {
    const inTok = data.usage?.input_tokens||0, outTok = data.usage?.output_tokens||0;
    const u = JSON.parse(localStorage.getItem('claude_usage')||'{}');
    u.calls=(u.calls||0)+1; u.costUSD=(u.costUSD||0)+inTok*0.0000008+outTok*0.000004;
    localStorage.setItem('claude_usage', JSON.stringify(u));
  } catch(_) {}
  return (data.content?.[0]?.text||'').trim();
}

// Turn 1: Claude proposes candidate words → JS verifies each strictly → Turn 2: sentence from verified only
async function claudeSentence(tiles, nums, apiKey) {
  const key = apiKey.trim();
  const model = 'claude-haiku-4-5-20251001';
  const sys = 'Απαντάς στα ελληνικά. Ακολουθείς ακριβώς τις οδηγίες.';

  // Normalize tiles for Claude: uppercase single letters → lowercase (same letter, different case only)
  // Accented tiles (ύ, ί, ό, ά, ή, ώ, έ) stay as-is — accent makes them a DIFFERENT tile from unaccented
  const normTiles = tiles.map(t =>
    (t.length === 1 && t !== t.toLowerCase()) ? t.toLowerCase() : t
  );

  // Build tile inventory string with counts for clarity
  const tileCount = {};
  for (const t of normTiles) tileCount[t] = (tileCount[t] || 0) + 1;
  const tileList = Object.entries(tileCount)
    .map(([t, n]) => n > 1 ? `${t}(×${n})` : t).join(', ');

  // Turn 1: get candidate word list from Claude
  const prompt1 = 'Πλακίδια κλήρωσης: ' + tileList + '\n\n'
    + 'Αυστηροί κανόνες:\n'
    + '1. Κάθε πλακίδιο χρησιμοποιείται ΜΟΝΟ ΜΙΑ ΦΟΡΑ (εκτός αν εμφανίζεται με ×2 κ.λπ.)\n'
    + '2. Τονισμένα και άτονα είναι ΔΙΑΦΟΡΕΤΙΚΑ πλακίδια: το «ύ» ≠ «υ», «ί» ≠ «ι», «ό» ≠ «ο» κ.λπ.\n'
    + '3. Δίγραφα (αυ, λλ, σκ κ.λπ.) χρησιμοποιούνται ΩΣ ΕΝΙΑΙΟ πλακίδιο\n'
    + '4. Για κάθε λέξη που προτείνεις, οι τόνοι πρέπει να ταιριάζουν ΑΚΡΙΒΩΣ με τα πλακίδια\n\n'
    + 'Ποιες ελληνικές λέξεις μπορούν να σχηματιστούν; Μία ανά γραμμή, μόνο λέξεις.';

  const rawWords = await anthropicFetch(key, model, sys, [{role:'user', content: prompt1}], 400);

  // Parse Claude's suggestions
  const candidates = rawWords.split('\n')
    .map(l => l.replace(/^[-–•*\d.)\s]+/, '').trim())
    .filter(l => l.length >= 2);

  // JS strictly verifies each candidate against the actual tile multiset
  const base = drawTileMultiset(nums);
  const verified = candidates.filter(w => spellWord(normWord(w), new Map(base)));

  if (!verified.length) return {sentence: null, words: [], rejected: candidates};

  // Turn 2: clean single prompt with ONLY verified words
  const prompt2 = 'Χρησιμοποιώντας ΜΟΝΟ αυτές τις λέξεις: ' + verified.join(', ')
    + ' — φτιάξε μια σύντομη πρόταση ή φράση. Απάντησε ΜΟΝΟ με την πρόταση, χωρίς εξηγήσεις.';

  const sentence = await anthropicFetch(key, model, sys, [{role:'user', content: prompt2}], 150);

  return {
    sentence: sentence.replace(/^["«»\s]+|["«»\s]+$/g,'').trim() || null,
    words: verified,
    rejected: candidates.filter(w => !verified.includes(w))
  };
}

let claudeBusy = false, claudeCacheSig = null, claudeCache = null;

async function renderAutoSentence(nums, sig) {
  const el = document.getElementById('autoSentence');
  const key = localStorage.getItem('claude_api_key');

  if (!key) {
    el.innerHTML = 'Πρόσθεσε <a href="kino_settings.html">Claude API key</a> στις ρυθμίσεις για αυτόματη σύνθεση πρότασης.';
    return;
  }

  if (claudeCacheSig === sig && claudeCache) {
    const {sentence, words, rejected} = claudeCache;
    el.innerHTML = (sentence ? `«${sentence}»` : '(δεν σχηματίστηκε πρόταση)')
      + `<span class="as-meta">✓ Επαληθευμένες λέξεις (JS Scrabble): ${words.join(', ')||'—'}`
      + (rejected?.length ? ` · ✗ Απορρίφθηκαν: ${rejected.join(', ')}` : '') + '</span>';
    return;
  }

  el.innerHTML = '<span class="as-meta">✦ Βήμα 1/2: Claude βρίσκει λέξεις…</span>';
  if (claudeBusy) return;
  claudeBusy = true;
  const tiles = nums.map(n => NUM_TO_CHAR[n]).filter(Boolean);
  try {
    const result = await claudeSentence(tiles, nums, key);
    claudeCacheSig = sig; claudeCache = result;
    const {sentence, words, rejected} = result;
    el.innerHTML = (sentence ? `«${sentence}»` : '(δεν σχηματίστηκε πρόταση)')
      + `<span class="as-meta">✓ Επαληθευμένες λέξεις (JS Scrabble): ${words.join(', ')||'—'}`
      + (rejected?.length ? ` · ✗ Απορρίφθηκαν: ${rejected.join(', ')}` : '') + '</span>';
  } catch(e) {
    el.innerHTML = `<span class="as-meta">⚠ Claude σφάλμα: ${e.message}</span>`;
  } finally {
    claudeBusy = false;
  }
}

// ── Draw rendering ─────────────────────────────────────────────────────────
function charClass(c) {
  if (!c) return '';
  const DIPHS = new Set(['ευ','αυ','οι','αι','ου','ει']);
  if (DIPHS.has(c.toLowerCase())) return ' diph';
  if (c.length === 2) return ' cluster';
  if (c.length === 1 && c !== c.toLowerCase()) return ' letter';
  if (/[άέήίόύώ]/.test(c)) return ' accent';
  return ' lower';
}

function renderDraw(draw) {
  document.getElementById('drawId').textContent = `Κλήρωση #${draw.id}`;
  document.getElementById('drawTime').textContent = draw.time;

  const grid = document.getElementById('numGrid');
  const balls = draw.nums.map(n => {
    const c = NUM_TO_CHAR[n] || '';
    const cls = 'num-ball drawn' + charClass(c);
    const fs = c.length > 1 ? '.55rem' : '.68rem';
    return `<div class="${cls}" title="${c} (${n})">
      <span style="font-size:${fs};display:block;line-height:1.1">${c}</span>
      <span style="font-size:.55rem;opacity:.75">${n}</span>
    </div>`;
  }).join('');
  grid.innerHTML = balls;

  const charLine = draw.nums.map(n => NUM_TO_CHAR[n] || '').join(' ');
  document.getElementById('drawLettersLine').textContent = charLine;
}

// ── Update delays on new draw ──────────────────────────────────────────────
function updateDelays(nums) {
  drawCounter++;
  for (let n=1; n<=80; n++) {
    if (nums.includes(n)) { delays[n] = 0; lastSeen[n] = drawCounter; }
    else delays[n]++;
  }
  if (delaysReady) renderDelayTable();
}

// ── GitHub auto-save ───────────────────────────────────────────────────────
async function autoSaveLiveBuffer() {
  if (!localStorage.getItem('gh_token') || !liveBuffer.size) return;
  if (saveLock) return;
  saveLock = true;
  const el = document.getElementById('saveStatus');
  el.textContent = '⏳ Αποθήκευση...';
  try {
    const byMonth = {};
    for (const [id, d] of liveBuffer) {
      const dayN = Math.floor((id - LIVE_BASE_ID) / 288);
      const dt = new Date(Date.UTC(2025, 0, 1) + dayN * 86400000);
      const ym = `${dt.getUTCFullYear()}_${pad(dt.getUTCMonth()+1)}`;
      if (!byMonth[ym]) byMonth[ym] = [];
      byMonth[ym].push(d);
    }
    let totalNew = 0;
    for (const [ym, draws] of Object.entries(byMonth)) {
      const mStr = ym.replace('_','-');
      const path = `data/raw/kino_raw_${ym}.json`;
      const existing = await ghGet(path) || {month:mStr, draws:[]};
      const exIds = new Set(existing.draws.map(d=>d.id));
      const newOnes = draws.filter(d=>!exIds.has(d.id));
      if (!newOnes.length) continue;
      const merged = [...existing.draws, ...newOnes].sort((a,b)=>a.id-b.id);
      await ghPut(path, {month:mStr, draws:merged}, `Live +${newOnes.length} ${mStr}`);
      totalNew += newOnes.length;
    }
    liveLastSavedCount = liveBuffer.size;
    el.textContent = totalNew > 0
      ? `✅ Αποθηκεύτηκαν ${totalNew} κλήρωση(εις) — ${new Date().toLocaleTimeString('el-GR')}`
      : '✓ Ήδη αποθηκευμένες';
  } catch(e) {
    el.textContent = '⚠ Σφάλμα αποθήκευσης: ' + e.message;
    console.error('autoSave error:', e);
  } finally {
    saveLock = false;
  }
}

// ── Live monitoring ────────────────────────────────────────────────────────
async function fetchLiveNow() {
  try {
    let draw = null;

    // 1. last-result-and-active (fastest)
    try {
      const d = await apiFetch(`${OPAP_BASE}/last-result-and-active`);
      if (d?.lastResult?.winningNumbers?.list?.length) {
        const r = d.lastResult;
        draw = {id: r.drawId, time: localTimeStr(toMs(r.drawTime)),
          nums: [...r.winningNumbers.list].sort((a,b)=>a-b),
          bonus: (r.winningNumbers.bonus||[])[0]||null};
      }
    } catch(_) {}

    // 2. Estimated draw ID
    if (!draw) {
      const est = estDrawId();
      for (const tryId of [est, est-1, est-2, est+1]) {
        try {
          const d = await apiFetch(`${OPAP_BASE}/${tryId}`);
          if (d?.winningNumbers?.list?.length) {
            draw = {id: d.drawId, time: localTimeStr(toMs(d.drawTime)),
              nums: [...d.winningNumbers.list].sort((a,b)=>a-b),
              bonus: (d.winningNumbers.bonus||[])[0]||null};
            break;
          }
        } catch(_) {}
      }
    }

    // 3. draw-date fallback (today)
    if (!draw) {
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
      try {
        const data = await apiFetch(`${OPAP_BASE}/draw-date/${todayStr}/${todayStr}?page=0&size=300`);
        const items = Array.isArray(data) ? data : (data?.content || data?.draws || []);
        const valid = items.filter(i=>i.winningNumbers?.list?.length).sort((a,b)=>b.drawId-a.drawId);
        if (valid.length) {
          const r = valid[0];
          draw = {id: r.drawId, time: localTimeStr(toMs(r.drawTime)),
            nums: [...r.winningNumbers.list].sort((a,b)=>a-b),
            bonus: (r.winningNumbers.bonus||[])[0]||null};
        }
      } catch(_) {}
    }

    if (!draw) {
      document.getElementById('drawTime').textContent = '⚠ Αδυναμία σύνδεσης — επόμενη προσπάθεια σε λίγο';
      return;
    }

    // Buffer for saving
    if (!liveBuffer.has(draw.id))
      liveBuffer.set(draw.id, {id: draw.id, n: draw.nums, b: draw.bonus});

    renderDraw(draw);
    renderAutoSentence(draw.nums, draw.id.toString());

    // Update delays only on new draw
    if (draw.id !== lastDrawId) {
      lastDrawId = draw.id;
      updateDelays(draw.nums);
    }

    // Auto-save every 6+ buffered draws
    if (liveBuffer.size - liveLastSavedCount >= 6) autoSaveLiveBuffer();

  } catch(e) {
    console.error('fetchLiveNow:', e);
    document.getElementById('drawTime').textContent = '⚠ Σφάλμα — νέα προσπάθεια σε λίγο';
  }
}

function scheduleLive() {
  if (!liveRunning) return;
  liveTimerId = setTimeout(() => { fetchLiveNow(); scheduleLive(); }, msToNext());
}

function startLive() {
  liveRunning = true;
  document.getElementById('liveBadge').className = 'badge on';
  document.getElementById('liveBadge').textContent = '● ΖΩΝΤΑΝΑ';
  fetchLiveNow();
  scheduleLive();
  liveCountdownId = setInterval(() => {
    if (!liveRunning) { clearInterval(liveCountdownId); return; }
    document.getElementById('countdown').textContent = `Επόμενη σε: ${fmtMs(msToNext())}`;
  }, 500);
}

function stopLive() {
  liveRunning = false;
  clearTimeout(liveTimerId);
  clearInterval(liveCountdownId);
  document.getElementById('liveBadge').className = 'badge off';
  document.getElementById('liveBadge').textContent = '⏸ ΕΚΤΟΣ';
  document.getElementById('countdown').textContent = '';
}

// ── Word → Numbers lookup ──────────────────────────────────────────────────
function lookupWord() {
  const raw = document.getElementById('wordInput').value.trim();
  const out = document.getElementById('lookupResult');
  if (!raw) { out.innerHTML = ''; return; }
  const norm = normWord(raw);
  const tiles = [];
  let i = 0, leftover = '';
  while (i < norm.length) {
    let matched = false;
    for (const p of PATTERNS) {
      if (p.length <= norm.length - i && norm.startsWith(p, i)) {
        tiles.push(p); i += p.length; matched = true; break;
      }
    }
    if (!matched) { leftover += norm[i]; i++; }
  }
  if (!tiles.length) {
    out.innerHTML = '<div class="lk-warn">Δεν αναγνωρίστηκε κανένας χαρακτήρας.</div>';
    return;
  }
  const tileHtml = tiles.map(t => {
    const n = CHAR_TO_NUM[t];
    return `<div class="lk-tile"><span class="lk-c">${t}</span><span class="lk-n">${n}</span></div>`;
  }).join('');
  const numList = tiles.map(t => CHAR_TO_NUM[t]).join(' - ');
  const warn = leftover ? `<div class="lk-warn">Αγνοήθηκαν: ${leftover}</div>` : '';
  out.innerHTML = `<div class="lk-tiles">${tileHtml}</div>
    <div class="lk-nums">Αριθμοί: ${numList}</div>${warn}`;
}

// ── Init ───────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  refreshTokenState();

  document.getElementById('lookupBtn').addEventListener('click', lookupWord);
  document.getElementById('wordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') lookupWord();
  });
  document.getElementById('wordInput').addEventListener('input', lookupWord);

  // Placeholder delay grid
  let ph = '';
  for(let n=1;n<=80;n++) ph+=`<div class="d-cell" style="background:#222"><span class="d-num">${n}</span><span class="d-val">?</span></div>`;
  document.getElementById('delayGrid').innerHTML = ph;

  loadHistoricalDelays().catch(e=>console.error('delay error',e))
    .then(() => gapFill(3).catch(e=>console.error('gapFill error',e)));

  setTimeout(startLive, 500);
});
