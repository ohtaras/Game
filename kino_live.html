<title>ΚΙΝΟ Live</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Dark-first: KINO live dashboard — two-column, number grids as heroes */
:root {
  --bg:        #070b12;
  --surface:   #0d1420;
  --surface2:  #111927;
  --border:    #182230;
  --fg:        #b8cad8;
  --muted:     #38506a;
  --live:      #00c2d4;
  --live-dim:  #00c2d41a;
  --rand:      #ffba00;
  --rand-dim:  #ffba001a;
  --hit:       #5af0a8;
  --hit-dim:   #5af0a81a;
  --chip-bg:   #0c111a;
  --chip-fg:   #1e2e3a;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  margin: 0;
  padding: 0 16px;
  padding-block: 16px;
}
.page { max-width: 880px; margin: 0 auto; }

/* ── Top bar ── */
.top-bar {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 12px;
  flex-wrap: wrap; margin-bottom: 14px;
}
.page-title { font-size: 1.05rem; font-weight: 700; color: var(--fg); letter-spacing: .06em; margin: 0; }
.page-sub   { font-size: .68rem; color: var(--muted); margin-top: 2px; }
.cd-box {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--live); border-radius: 6px;
  padding: 6px 14px; min-width: 140px;
}
.cd-label { font-size: .62rem; color: var(--muted); text-transform: uppercase; letter-spacing: .09em; }
.cd-val   { font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; font-weight: 700;
            color: var(--live); font-variant-numeric: tabular-nums; }
.cd-next  { font-size: .62rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

/* ── Status ── */
#statusLine { font-size: .68rem; color: var(--muted); margin-bottom: 12px; min-height: 1.2em; }

/* ── Two columns ── */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
@media (max-width: 580px) { .cols { grid-template-columns: 1fr; } }

.col {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden;
  display: flex; flex-direction: column; gap: 0;
}
.col-head {
  padding: 9px 12px 7px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.col-tag {
  font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em;
}
.col-live .col-tag { color: var(--live); }
.col-rand .col-tag { color: var(--rand); }
.col-live { border-top: 2px solid var(--live); }
.col-rand { border-top: 2px solid var(--rand); }

.col-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 9px; }

.draw-info { font-family: 'JetBrains Mono', monospace; }
.draw-id   { font-size: .82rem; font-weight: 700; }
.draw-meta { font-size: .62rem; color: var(--muted); margin-top: 1px; }

/* ── 80-number grid ── */
.num-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 2px;
}
.chip {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; font-family: 'JetBrains Mono', monospace;
  font-size: .58rem; font-weight: 700; font-variant-numeric: tabular-nums;
  background: var(--chip-bg); color: var(--chip-fg);
}
.chip.c-live { background: var(--live-dim); color: var(--live); }
.chip.c-live.bright { background: var(--live); color: #03080e; }
.chip.c-rand { background: var(--rand-dim); color: var(--rand); }
.chip.c-rand.bright { background: var(--rand); color: #0a0800; }
.chip.c-hit  { background: var(--hit); color: #02120a; font-weight: 700; }
.chip.c-miss { background: transparent; border: 1px solid #ffba0030; color: #ffba0040; }

/* ── Eval section ── */
.eval-sep { height: 1px; background: var(--border); margin: 0 12px; }
.eval-body { padding: 9px 12px; display: flex; flex-direction: column; gap: 7px; }
.eval-tag { font-size: .6rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.eval-score {
  font-family: 'JetBrains Mono', monospace; font-size: .78rem; font-weight: 700;
}
.score-n { font-size: 1.1rem; }
.h-color { color: var(--hit); }
.m-color { color: var(--muted); }

/* ── Placeholder ── */
.ph { padding: 24px 12px; color: var(--muted); font-size: .72rem; text-align: center; }

/* ── Loading overlay ── */
#loadBar {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 12px; font-size: .7rem; color: var(--muted);
  margin-bottom: 10px; display: none;
}
.prog-fill {
  height: 2px; background: var(--live); border-radius: 1px; margin-top: 4px;
  transition: width .3s;
}
</style>

<div class="page">
  <div class="top-bar">
    <div>
      <p class="page-title">ΚΙΝΟ Live</p>
      <p class="page-sub">Τελευταία κλήρωση · Τυχαία ίδιας ώρας · Αξιολόγηση</p>
    </div>
    <div class="cd-box">
      <div class="cd-label">Επόμενη κλήρωση</div>
      <div class="cd-val" id="cdVal">—:——</div>
      <div class="cd-next" id="cdNext">ώρα —:——</div>
    </div>
  </div>

  <div id="statusLine">Ετοιμασία…</div>
  <div id="loadBar">
    <span id="loadText">Φόρτωση ιστορικού…</span>
    <div class="prog-fill" id="progFill" style="width:0%"></div>
  </div>

  <div class="cols">
    <!-- Live draw column -->
    <div class="col col-live" id="colLive">
      <div class="col-head">
        <span class="col-tag">● Τελευταία κλήρωση</span>
        <span id="liveDrawId" style="font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--muted)"></span>
      </div>
      <div id="liveBody" class="col-body">
        <div class="ph">Φόρτωση κληρώσεων…</div>
      </div>
      <div id="evalSection" style="display:none">
        <div class="eval-sep"></div>
        <div class="eval-body">
          <div class="eval-tag">Αξιολόγηση τυχαίας</div>
          <div class="eval-score" id="evalScore"></div>
          <div class="num-grid" id="evalGrid"></div>
        </div>
      </div>
    </div>

    <!-- Random draw column -->
    <div class="col col-rand" id="colRand">
      <div class="col-head">
        <span class="col-tag" id="randTag">🎲 Τυχαία — ίδια ώρα</span>
        <span id="randDrawId" style="font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--muted)"></span>
      </div>
      <div id="randBody" class="col-body">
        <div class="ph">Φόρτωση ιστορικού…</div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

const KINO_ID   = 1100;
const ATHENS_MS = 3 * 3600000; // UTC+3

const ath    = ms => new Date(ms + ATHENS_MS);
const pad    = n  => String(n).padStart(2, '0');
const dateOf = ms => { const d = ath(ms); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth()+1) + '-' + pad(d.getUTCDate()); };
const minsOf = ms => { const d = ath(ms); return d.getUTCHours()*60 + d.getUTCMinutes(); };
const mStr   = m  => pad(Math.floor(m/60)) + ':' + pad(m%60);

// ── State ──────────────────────────────────────────────────────────────────
var histPool  = [];   // {id, arr[20], set, b, d, m}
var liveDraw  = null; // latest completed draw
var randDraw  = null; // random pick for upcoming slot
var evalDraw  = null; // previous randDraw, kept for evaluation after new live
var refreshTm  = null;
var cdTm       = null;
var lastNextMin = -1;

// ── OPAP API ───────────────────────────────────────────────────────────────
async function apiFetch(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function fetchDay(dayStr) {
  var items = [], page = 0;
  for (;;) {
    var url = 'https://api.opap.gr/draws/v3.0/' + KINO_ID + '/draw-date/' + dayStr + '/' + dayStr +
              '?page=' + page + '&size=500&_=' + Date.now();
    var raw;
    try { raw = await apiFetch(url); } catch(e) { break; }
    if (!raw) break;
    var pg = Array.isArray(raw) ? raw : (raw.content || raw.draws || []);
    if (!pg.length) break;
    items = items.concat(pg);
    if (Array.isArray(raw) || raw.last) break;
    if (++page > 10) break;
  }
  return items;
}

function parseDraw(item) {
  if (!item || !item.drawTime) return null;
  var wn  = item.winningNumbers || {};
  var lst = (wn.list || []).map(Number).filter(function(n){ return n >= 1 && n <= 80; });
  if (lst.length < 20) return null;
  var arr = lst.slice(0, 20).sort(function(a,b){ return a-b; });
  return {
    id:  item.drawId,
    arr: arr,
    set: new Set(arr),
    b:   (wn.bonus||[])[0] ? Number((wn.bonus||[])[0]) : null,
    d:   dateOf(item.drawTime),
    m:   minsOf(item.drawTime)
  };
}

// ── Time helpers ──────────────────────────────────────────────────────────
function msToNextDraw() {
  var now  = ath(Date.now());
  var secs = now.getUTCHours()*3600 + now.getUTCMinutes()*60 + now.getUTCSeconds() + now.getUTCMilliseconds()/1000;
  var next = Math.ceil(secs / 300) * 300;
  return Math.max(0, next - secs) * 1000;
}
function nextDrawMin() {
  var now  = ath(Date.now());
  var mins = now.getUTCHours()*60 + now.getUTCMinutes() + now.getUTCSeconds()/60;
  return Math.ceil(mins / 5) * 5;
}

// ── Countdown ─────────────────────────────────────────────────────────────
function tickCd() {
  var ms   = msToNextDraw();
  var sec  = Math.round(ms / 1000);
  var mm   = Math.floor(sec / 60);
  var ss   = sec % 60;
  var cdv  = document.getElementById('cdVal');
  var cdn  = document.getElementById('cdNext');
  if (cdv) cdv.textContent = mm + ':' + pad(ss);
  var nm = nextDrawMin();
  if (cdn) cdn.textContent = 'ώρα ' + mStr(nm);
  // When the slot changes, re-pick the random draw immediately
  if (nm !== lastNextMin) {
    lastNextMin = nm;
    randDraw = pickRandom();
    renderRand();
  }
}

// ── Load history ──────────────────────────────────────────────────────────
async function loadHistory() {
  var lb = document.getElementById('loadBar');
  var lt = document.getElementById('loadText');
  var pf = document.getElementById('progFill');
  if (lb) lb.style.display = '';

  var today = dateOf(Date.now());
  var days  = [];
  for (var i = 1; i <= 14; i++) days.push(dateOf(Date.now() - i*86400000));

  var seen  = new Set(histPool.map(function(d){ return d.id; }));
  var BATCH = 5;
  for (var bi = 0; bi < days.length; bi += BATCH) {
    var batch   = days.slice(bi, bi + BATCH);
    if (lt) lt.textContent = 'Φόρτωση ιστορικού — ' + Math.min(bi+BATCH, days.length) + '/14 ημέρες…';
    if (pf) pf.style.width = (Math.min(bi+BATCH, days.length) / 14 * 100).toFixed(0) + '%';
    var results = await Promise.all(batch.map(function(ds){ return fetchDay(ds).catch(function(){ return []; }); }));
    for (var ri = 0; ri < results.length; ri++) {
      for (var ii = 0; ii < results[ri].length; ii++) {
        var parsed = parseDraw(results[ri][ii]);
        if (parsed && !seen.has(parsed.id)) { histPool.push(parsed); seen.add(parsed.id); }
      }
    }
  }
  histPool.sort(function(a,b){ return a.id - b.id; });
  if (lb) lb.style.display = 'none';
}

async function loadToday() {
  var today = dateOf(Date.now());
  var items = await fetchDay(today).catch(function(){ return []; });
  var seen  = new Set(histPool.map(function(d){ return d.id; }));
  for (var i = 0; i < items.length; i++) {
    var parsed = parseDraw(items[i]);
    if (parsed && !seen.has(parsed.id)) { histPool.push(parsed); seen.add(parsed.id); }
  }
  histPool.sort(function(a,b){ return a.id - b.id; });
  if (histPool.length) liveDraw = histPool[histPool.length - 1];
}

// ── Pick random draw ───────────────────────────────────────────────────────
function pickRandom() {
  var nm    = nextDrawMin(); // exact minute of next draw (e.g. 750 = 12:30)
  var today = dateOf(Date.now());
  // exact slot match from past dates
  var pool  = histPool.filter(function(d){ return d.m === nm && d.d !== today; });
  if (!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

// ── Check for new draw ─────────────────────────────────────────────────────
async function checkNewDraw() {
  var today = dateOf(Date.now());
  var items = await fetchDay(today).catch(function(){ return []; });
  var seen  = new Set(histPool.map(function(d){ return d.id; }));
  var added = false;
  for (var i = 0; i < items.length; i++) {
    var parsed = parseDraw(items[i]);
    if (parsed && !seen.has(parsed.id)) {
      histPool.push(parsed); seen.add(parsed.id); added = true;
    }
  }
  if (added) histPool.sort(function(a,b){ return a.id - b.id; });

  var latest = histPool.length ? histPool[histPool.length - 1] : null;
  if (latest && (!liveDraw || latest.id > liveDraw.id)) {
    // New draw found — advance state
    evalDraw = randDraw;
    liveDraw = latest;
    randDraw = pickRandom();
    renderAll();
    return true;
  }
  return false;
}

function scheduleRefresh() {
  clearTimeout(refreshTm);
  var delay   = msToNextDraw() + 15000;
  var retries = 0;
  function tryFetch() {
    checkNewDraw().then(function(found) {
      if (found) { scheduleRefresh(); return; } // new draw found, arm next cycle
      retries++;
      if (retries < 12) {
        // retry every 15s for up to ~3 min after expected draw time
        refreshTm = setTimeout(tryFetch, 15000);
      } else {
        scheduleRefresh(); // give up on this slot, wait for next
      }
    });
  }
  refreshTm = setTimeout(tryFetch, delay);
}

// ── Render ─────────────────────────────────────────────────────────────────
function makeGrid(drawn, hitSet, classDrawn, classMiss) {
  var html = '<div class="num-grid">';
  for (var n = 1; n <= 80; n++) {
    var isDrawn = drawn.has(n);
    var isHit   = hitSet && hitSet.has(n);
    var cls = 'chip';
    if (isDrawn && isHit) {
      cls += ' c-hit';
    } else if (isDrawn) {
      cls += ' ' + classDrawn + ' bright';
    } else if (hitSet && !isDrawn && !isHit) {
      // not drawn, not a hit — plain dim
      cls += '';
    } else {
      cls += '';
    }
    html += '<div class="' + cls + '">' + n + '</div>';
  }
  html += '</div>';
  return html;
}

function makeEvalGrid(evalNums, liveSet) {
  // evalNums = the 20 numbers of evalDraw
  // Show each: green if it appears in liveSet, faint amber otherwise
  var html = '<div class="num-grid">';
  for (var n = 1; n <= 80; n++) {
    var isEval = evalNums.has(n);
    var isHit  = isEval && liveSet.has(n);
    var cls = 'chip';
    if (isHit)       cls += ' c-hit';
    else if (isEval) cls += ' c-miss';
    html += '<div class="' + cls + '">' + n + '</div>';
  }
  html += '</div>';
  return html;
}

function renderLive() {
  var el = document.getElementById('liveBody');
  var di = document.getElementById('liveDrawId');
  if (!el) return;
  if (!liveDraw) {
    el.innerHTML = '<div class="ph">Αναμονή κλήρωσης…</div>';
    if (di) di.textContent = '';
    return;
  }
  if (di) di.textContent = '#' + liveDraw.id;
  el.innerHTML =
    '<div class="draw-info">' +
      '<div class="draw-id" style="color:var(--live)">#' + liveDraw.id + '</div>' +
      '<div class="draw-meta">' + liveDraw.d.slice(5).replace('-','/') + ' · ' + mStr(liveDraw.m) + '</div>' +
    '</div>' +
    makeGrid(liveDraw.set, null, 'c-live', '');
}

function renderRand() {
  var el  = document.getElementById('randBody');
  var di  = document.getElementById('randDrawId');
  var tag = document.getElementById('randTag');
  if (!el) return;
  var nm = nextDrawMin();
  if (tag) tag.textContent = '🎲 Τυχαία — ' + mStr(nm);
  if (!randDraw) {
    el.innerHTML = '<div class="ph">Δεν βρέθηκε τυχαία κλήρωση για ' + mStr(nm) + '.</div>';
    if (di) di.textContent = '';
    return;
  }
  if (di) di.textContent = '#' + randDraw.id;
  el.innerHTML =
    '<div class="draw-info">' +
      '<div class="draw-id" style="color:var(--rand)">#' + randDraw.id + '</div>' +
      '<div class="draw-meta">' + randDraw.d.slice(5).replace('-','/') + ' · ' + mStr(randDraw.m) + '</div>' +
    '</div>' +
    makeGrid(randDraw.set, null, 'c-rand', '');
}

function renderEval() {
  var sec = document.getElementById('evalSection');
  if (!sec) return;
  if (!evalDraw || !liveDraw) { sec.style.display = 'none'; return; }
  var hits = 0;
  evalDraw.arr.forEach(function(n){ if (liveDraw.set.has(n)) hits++; });
  sec.style.display = '';
  var sc = document.getElementById('evalScore');
  if (sc) {
    sc.innerHTML =
      'Τυχαία <span style="color:var(--muted)">#' + evalDraw.id + '</span>: ' +
      '<span class="score-n h-color">' + hits + '</span>' +
      '<span class="m-color">/20 αριθμοί σωστοί</span>';
  }
  var eg = document.getElementById('evalGrid');
  if (eg) eg.outerHTML = makeEvalGrid(evalDraw.set, liveDraw.set)
    .replace('<div class="num-grid">', '<div class="num-grid" id="evalGrid">');
}

function renderStatus() {
  var sl = document.getElementById('statusLine');
  if (!sl) return;
  if (!liveDraw) { sl.textContent = 'Φόρτωση…'; return; }
  sl.textContent = 'Ιστορικό: ' + histPool.length + ' κληρώσεις · τελευταία #' + liveDraw.id +
    ' · ' + liveDraw.d.slice(5).replace('-','/') + ' ' + mStr(liveDraw.m);
}

function renderAll() {
  renderLive();
  renderRand();
  renderEval();
  renderStatus();
}

// ── Init ──────────────────────────────────────────────────────────────────
async function init() {
  // Start countdown immediately
  tickCd();
  cdTm = setInterval(tickCd, 1000);

  document.getElementById('statusLine').textContent = 'Φόρτωση σημερινών κληρώσεων…';
  await loadToday();
  randDraw = pickRandom();
  renderAll();

  document.getElementById('statusLine').textContent = 'Φόρτωση ιστορικού 14 ημερών…';
  await loadHistory();
  randDraw = pickRandom(); // re-pick with full pool
  renderAll();

  scheduleRefresh();
}

init();
</script>
