<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINO Κληρώσεις</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; }

    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: white;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 1.6rem; font-weight: 700; }
    header span { font-size: 2rem; }

    .controls {
      max-width: 900px;
      margin: 32px auto 0;
      padding: 0 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .controls label { font-weight: 600; font-size: 0.95rem; }
    .controls input[type=date] {
      padding: 10px 14px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    .controls input[type=date]:focus { border-color: #4361ee; }
    .controls button {
      padding: 10px 24px;
      background: #4361ee;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .controls button:hover { background: #3251d4; }
    .controls button:disabled { background: #aaa; cursor: not-allowed; }
    #btnExport {
      background: #2ec4b6;
      margin-left: auto;
      display: none;
    }
    #btnExport:hover { background: #25a99d; }

    #status {
      max-width: 900px;
      margin: 16px auto 0;
      padding: 0 16px;
      font-size: 0.92rem;
      color: #555;
    }
    #status.error { color: #e63946; font-weight: 600; }

    #spinner {
      display: none;
      max-width: 900px;
      margin: 32px auto;
      text-align: center;
      color: #4361ee;
      font-size: 1.1rem;
    }
    .spin {
      display: inline-block;
      width: 32px; height: 32px;
      border: 4px solid #cdd;
      border-top-color: #4361ee;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #results {
      max-width: 900px;
      margin: 24px auto 48px;
      padding: 0 16px;
    }
    .summary {
      background: white;
      border-radius: 10px;
      padding: 14px 20px;
      margin-bottom: 16px;
      font-size: 0.95rem;
      color: #555;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .summary strong { color: #1a1a2e; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    thead tr { background: #1a1a2e; color: white; }
    th { padding: 14px 16px; text-align: left; font-size: 0.85rem; text-transform: uppercase; letter-spacing: .05em; }
    td { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; vertical-align: top; font-size: 0.92rem; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8f9ff; }

    .draw-id { color: #888; font-size: 0.82rem; }
    .time { font-weight: 700; color: #4361ee; font-size: 1rem; }
    .numbers { display: flex; flex-wrap: wrap; gap: 6px; }
    .ball {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: #4361ee;
      color: white;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ball.bonus { background: #e63946; }
  </style>
</head>
<body>

<header>
  <span>🎱</span>
  <div>
    <h1>KINO — Κληρώσεις ΟΠΑΠ</h1>
    <div style="font-size:.85rem;opacity:.7;margin-top:4px">Επιλέξτε ημερομηνία για να δείτε τα αποτελέσματα</div>
  </div>
</header>

<div class="controls">
  <label for="datePicker">Ημερομηνία:</label>
  <input type="date" id="datePicker">
  <button id="btnFetch" onclick="loadDraws()">🔍 Φόρτωση Κληρώσεων</button>
  <button id="btnExport" onclick="exportJSON()">💾 Αποθήκευση JSON</button>
</div>

<div id="status"></div>
<div id="spinner"><div class="spin"></div>Φόρτωση κληρώσεων…</div>
<div id="results"></div>

<script>
  // Default to today
  const today = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('datePicker').value =
    `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;

  let lastData = null;

  async function loadDraws() {
    const date = document.getElementById('datePicker').value;
    if (!date) return;

    const btn = document.getElementById('btnFetch');
    const status = document.getElementById('status');
    const spinner = document.getElementById('spinner');
    const results = document.getElementById('results');
    const btnExport = document.getElementById('btnExport');

    btn.disabled = true;
    status.className = '';
    status.textContent = '';
    spinner.style.display = 'block';
    results.innerHTML = '';
    btnExport.style.display = 'none';
    lastData = null;

    try {
      const url = `https://api.opap.gr/draws/v3.0/1100/draw-date/${date}`;
      const resp = await fetch(url, {
        headers: { 'Accept': 'application/json' }
      });

      if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);

      const raw = await resp.json();
      const draws = (raw.content || []).map(item => ({
        draw_id: item.drawId,
        draw_time: item.drawTime,
        winning_numbers: (item.winningNumbers?.list || []).sort((a,b)=>a-b),
        bonus: item.winningNumbers?.bonus || []
      }));

      lastData = { date, total_draws: draws.length, draws };

      if (draws.length === 0) {
        status.textContent = 'Δεν βρέθηκαν κληρώσεις για αυτή την ημερομηνία.';
        return;
      }

      status.textContent = `Βρέθηκαν ${draws.length} κληρώσεις για ${formatDate(date)}.`;
      btnExport.style.display = 'inline-block';
      renderTable(draws);

    } catch (err) {
      status.className = 'error';
      if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
        status.textContent = '⚠️ Αδύνατη η σύνδεση με το OPAP API. Βεβαιωθείτε ότι έχετε σύνδεση στο internet.';
      } else {
        status.textContent = `Σφάλμα: ${err.message}`;
      }
    } finally {
      btn.disabled = false;
      spinner.style.display = 'none';
    }
  }

  function renderTable(draws) {
    const results = document.getElementById('results');
    let html = `<div class="summary">📅 <strong>${draws.length}</strong> κληρώσεις &nbsp;|&nbsp; ⏱ ${draws[0]?.draw_time} – ${draws[draws.length-1]?.draw_time}</div>`;
    html += '<table><thead><tr><th>Ώρα</th><th>Κλήρωση #</th><th>Αριθμοί (20 από 80)</th></tr></thead><tbody>';
    for (const d of draws) {
      const balls = d.winning_numbers.map(n => `<div class="ball">${n}</div>`).join('');
      const bonus = d.bonus.map(n => `<div class="ball bonus">${n}</div>`).join('');
      html += `<tr>
        <td><div class="time">${d.draw_time}</div></td>
        <td><div class="draw-id">${d.draw_id}</div></td>
        <td><div class="numbers">${balls}${bonus}</div></td>
      </tr>`;
    }
    html += '</tbody></table>';
    results.innerHTML = html;
  }

  function exportJSON() {
    if (!lastData) return;
    const blob = new Blob([JSON.stringify(lastData, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `kino_${lastData.date.replace(/-/g,'')}.json`;
    a.click();
  }

  function formatDate(d) {
    const [y,m,day] = d.split('-');
    const months = ['Ιαν','Φεβ','Μαρ','Απρ','Μαΐ','Ιουν','Ιουλ','Αυγ','Σεπ','Οκτ','Νοε','Δεκ'];
    return `${day} ${months[+m-1]} ${y}`;
  }
</script>

</body>
</html>
